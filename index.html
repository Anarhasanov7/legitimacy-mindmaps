*No jargon. Read top to bottom. The other maps hold the details — this one is the story.*

## THE ONE-SENTENCE VERSION
- **Legitimacy = "does this look like a real, trustworthy business to outsiders?"** — the outsiders (banks, clients, the public) decide. Not the founder.

## THE PROBLEM YOUR THESIS SOLVES
- New and unconventional founders (women, immigrants, career-switchers) don't LOOK like "real" entrepreneurs to judges
- Nobody trusts them → no loans, no clients, no support
- Training programs teach business SKILLS — but nobody ever tested whether training changes what judges think
- **Your thesis = the first test: can a 12-hour training make outsiders see a founder as legitimate?**

## WHO STUDIED WHAT (one sentence each)
- **SIRAZ studied the JUDGES.** She showed people fake startup profiles and measured what makes them say "this is a real business." → Answer: looking like a normal, recognizable business beats everything else.
- **ALDEBERT studied the HELPERS.** She watched an accelerator for 2 years — can it lend its reputation to startups? → Answer: yes, but only after the accelerator itself is trusted.
- **SCHOON built the RULER.** Legitimacy is never inside a person — it's the RELATIONSHIP between venture and judge: the judge's expectations + the venture's signals + the judge's approval.
- **GHODS proved it pays.** Startups going abroad only succeed if they're seen as legitimate first — legitimacy converts into real performance.
- **BERTRAND studied the FOUNDER'S feelings.** A founder who feels like a fraud (impostor) stops acting — internal legitimacy matters too.
- **THE CLASSICS (Suchman, Zimmerman & Zeitz, Fisher)** built the vocabulary: legitimacy is a resource that unlocks money, clients, and survival.

## YOUR THESIS IN ONE PICTURE
- Judges hold a yardstick (Schoon's "expectations")
- Your 12h module teaches founders to send the right signals (Schoon's "conformity" = your 5 capabilities: Cognitive · Pragmatic · Social · Factual · Regulative)
- Siraz proved judges respond to exactly these signals ("assent")
- **Nobody connected the two: nobody trained the founder and measured the judge**
- **You run the experiment: randomize founders → train half → measure whether judges rate them higher**

## WHY IT MATTERS (the elevator pitch)
- If training works → a cheap 12-hour fix for the legitimacy gap faced by unconventional founders
- If it doesn't → proves legitimacy lives outside the founder's reach → policy should target judges/platforms, not founders
- Either way you learn something the field doesn't know`,

- **Paper:** Siraz, Claes & De Castro — European Management Review 2026
- **Details:**
  - *The question:* What happens when a venture sends good AND bad signals at the same time?
  - *What they did:* Each judge rated 16 made-up venture profiles mixing positive and negative cues. (This design is called a "conjoint" — you show many combinations and see which signals move the rating.)

  - *Found:* contradictory cues cancel each other → judgment stalls in the grey zone; judges' own green values made them discount pro-industry signals
  - *Caveats → solutions:*
    - *Problem: judges get tired* — after many profiles people stop reading carefully → *Fix:* an "orthogonal" design = profiles randomized so every combination still gets tested while each judge only sees 16
    - *Problem: the judge's own beliefs interfere* — an environmentalist may ignore a good signal → *Fix:* before the experiment they measured each judge's environmental values, then checked if green judges rated identical profiles differently (this is called a "moderator" — a factor that changes how strong an effect is)
  - *For you:* teach consistent signal bundles — one contradiction stalls the whole judgment

## YOUR ATENA METHODS — caveat cheat sheet (what committee WILL ask)
### Your Experiment (Article 1 — Field RCT)
- **Details:**
  - *Problem: "your sample is small — underpowered"* — too few founders → a real effect can look null → THE #1 attack on field experiments → *Your answer:* pre-registered power analysis + ITT (you count everyone assigned to treatment even if they dropped out — conservative, standard practice) + report effect sizes and confidence intervals, not just p-values
  - *Problem: attrition* — founders drop between waves; if leavers differ from stayers, estimates bias → *Your answer:* compare leavers vs stayers on their baseline answers + imputation (statistically filling missing answers)
  - *Problem: contamination* — control founders learn module content from treated peers → effect shrinks → *Your answer:* separate cohorts + staggered rollout + measure spillovers directly
  - *Problem: self-report only* — circular if the founder reports their own legitimacy → *Your answer:* objective milestones (registrations, applications, revenue) + pitch-deck text scores (Ghods BJM 2026 method)

### Your Interviews (Article 2 — Gioia method)
- **Details:**
  - *Problem: "coding is subjective"* — the researcher reads meaning into quotes → the standard attack on all qualitative work → *Your answer:* Gioia data structure — show the full chain in a table: raw quote → first-order code → second-order theme → aggregate dimension; plus two coders + kappa (an agreement score; >.80 is strong)
  - *Problem: recall bias* — founders reconstruct their story afterwards → *Your answer:* ask for concrete episodes, not opinions ("walk me through your last pitch") + triangulate statements against survey scores
  - *Problem: small n* — can't generalize statistically → *Your answer:* that's fine — you're hunting the mechanism, not prevalence; comparing high vs low responders IS the design

### Your Longitudinal Survey (T0 → T1 → T4)
- **Details:**
  - *Problem: CMV* — same person, same survey, same sitting inflates correlations ("common-method variance") → *Your answer:* separate measurements in time + different question formats + objective markers
  - *Problem: panel conditioning* — people answer differently just because they've seen the survey before → *Your answer:* the control group at every wave absorbs it
  - *Problem: maturation* — founders change over time regardless of training → *Your answer:* the control group separates natural growth from the treatment effect

### Anchor: "Business training works — but only modestly" 💡 REVIEW
- **Paper:** McKenzie & Woodruff — World Bank review 2014
- **Details:**
  - *The question:* Billions spent on entrepreneurship training — does it actually work?
  - *Found:* real but modest, heterogeneous effects → argues for targeted, capability-specific training over generic programs
  - *For you:* your honest baseline — generic training shows modest effects; a legitimacy-SPECIFIC module is the untested lever`,

## PART A — YOUR ATENA METHODS (The 3 Designs You Actually Run)

### A1. FIELD EXPERIMENT / RCT — Article 1 (Your Causal Engine)
- **1. Who Evaluates & What They Do:** Nascent entrepreneurs randomized into Treatment (12h legitimacy module) vs Control. Judges = real market stakeholders; you measure the founder-side node + objective milestones.
- **2. How They Do It:** Random assignment → T0 baseline → 12h module across 5 capabilities → T1 post-test → T4 follow-up. Analysis: ITT + ANCOVA/DiD on self-legitimacy and perceived legitimacy scales.
- **3. Problems & Fixes (each expanded):**
  - *Problem: attrition* — founders drop out between T0→T1→T4 → if leavers differ from stayers, estimates bias → severity: HIGH (most common field-RCT killer) → *Fix:* ITT estimation + leaver/stayer baseline comparison + multiple imputation
  - *Problem: contamination/spillovers* — treated founders share content with control peers → treatment effect shrinks artificially → severity: MEDIUM-HIGH → *Fix:* cohort separation + staggered rollout + measure spillovers directly
  - *Problem: self-report bias* — founders inflate confidence on survey items → severity: MEDIUM → *Fix:* triangulate with objective milestones (registrations, applications, revenue) + pitch-deck text scores
  - *Problem: small sample power* — field n often <300 → real effects can look null → severity: HIGH → *Fix:* pre-registered power analysis + report effect sizes + CIs, not just p-values
- **4. How You Apply It:** Article 1 — the causal test that legitimacy can be trained; the design the literature has never run.

### A2. SEMI-STRUCTURED INTERVIEWS — Article 2 (Your Mechanism Tracer)
- **1. Who Evaluates & What They Do:** You interview founders from both arms — high vs low responders. ~30–60 min each.
- **2. How They Do It:** Interview guide on the 5 capabilities → record → transcribe → thematic coding (Gioia: 1st-order codes → 2nd-order themes → aggregate dimensions). Anchor: Aldebert (2021/23) ran 34 interviews / 24 months in the same ecosystem.
- **3. Problems & Fixes (each expanded):**
  - *Problem: coding subjectivity* — researcher reads meaning into quotes → the standard attack on all qualitative work → severity: HIGH → *Fix:* Gioia data structure table (show the raw quote → code → theme → dimension chain) + dual coders + Cohen's kappa
  - *Problem: recall bias* — founders reconstruct their story after the fact → memory edits reality → severity: MEDIUM → *Fix:* ask concrete episodes not opinions ("walk me through your last pitch") + triangulate vs survey scores
  - *Problem: social desirability* — founders tell you training "worked" → severity: MEDIUM → *Fix:* anonymized transcripts + neutral framing + compare high vs low responders (extreme-case sampling)
  - *Problem: small n* — can't generalize statistically → severity: HIGH if you claim prevalence → *Fix:* the goal is MECHANISM not prevalence — extreme-case sampling IS the design
- **4. How You Apply It:** Article 2 — explains HOW/WHY the treatment works inside the founder; complements Article 1's causal estimate.

### A3. LONGITUDINAL MULTI-WAVE SURVEY — T0 → T1 → T4 (Your Measurement Spine)
- **1. Who Evaluates & What They Do:** Founders report self-legitimacy + perceived standing at 3+ time points.
- **2. How They Do It:** Same validated scales every wave (Bertrand self-legitimacy + perceived legitimacy) at T0/T1/T4. Analysis: repeated-measures multilevel model (waves nested in persons); treatment × time interaction = training effect. Same panel logic as Ghods (412 firm-years) but at founder level.
- **3. Problems & Fixes (each expanded):**
  - *Problem: common-method variance (CMV)* — same person, same instrument, same sitting → correlations inflated → severity: HIGH → *Fix:* temporal separation between waves + different scale anchors + objective markers
  - *Problem: panel conditioning* — founders answer differently because they've seen the survey before → severity: MEDIUM → *Fix:* control group at every wave absorbs the conditioning effect
  - *Problem: panel attrition* — cumulative loss across waves → severity: HIGH → *Fix:* ITT + multiple imputation + incentives per wave
  - *Problem: maturation* — founders change over time regardless of treatment → severity: MEDIUM → *Fix:* RCT design separates growth from treatment effect
- **4. How You Apply It:** The measurement backbone of Article 1 — your defense against "one-shot survey" critiques.

## PART B — METHODS FROM THE LITERATURE (What Others Use)

## B1. CONJOINT / FACTORIAL EXPERIMENT (The Evaluator Cognition Standard)
- **1. Who Evaluates & What They Do:** Human judges (bankers, consumers, investors; Siraz's 31–781 evaluators) read hypothetical venture profiles and assign legitimacy/funding scores.
- **2. How They Do It:** Software generates randomized cue bundles; each judge rates 16–32 profiles. Multilevel regression models Level-1 ratings nested inside Level-2 judges.
- **3. Problems & Fixes (each expanded):**
  - *Problem: rating fatigue* — judges go on autopilot after ~30 profiles → responses get noisy → severity: MEDIUM → *Fix:* orthogonal fractional factorial design caps at 16–32 profiles per judge
  - *Problem: non-independence* — one judge's 16 ratings correlate → standard errors too small → severity: HIGH if ignored → *Fix:* random-effects hierarchical model clusters errors by judge
  - *Problem: hypothetical bias* — vignette judgments ≠ real funding decisions → severity: MEDIUM → *Fix:* high-realism pitch vignettes mimicking real applications
- **4. How You Apply It:** Planned Article 4 — randomized atEnA pitch profiles to real regional bank officers and grant committees.

## B2. COMPUTATIONAL TEXT ANALYSIS (Objective Dyadic Measurement)
- **1. Who Evaluates & What They Do:** NLP algorithms act as automated evaluators of written artifacts (websites, pitch decks, press releases) paired with target audiences.
- **2. How They Do It:** Algorithms parse text into multi-dimensional legitimacy dictionaries (pragmatic, moral, cognitive, regulatory). Each firm gets a composite score + per-dimension metrics.
- **3. Problems & Fixes (each expanded):**
  - *Problem: contextual nuance* — algorithms misread sarcasm/complex language → severity: MEDIUM → *Fix:* multi-stage human expert calibration of dictionary weights
  - *Problem: single-audience bias* — text scored for one audience misses others → *Fix:* dyadic audience modeling (score relative to audience type)
  - *Problem: validity question* — does the score reflect real outcomes? → severity: HIGH → *Fix:* econometric validation against out-of-sample venture failure data
- **4. How You Apply It:** Objective check on participant pitch decks — kills common-method variance critiques.

## B3. QUALITATIVE CASE STUDY (Mechanism & Process Discovery)
- **1. Who Evaluates & What They Do:** The researcher evaluates incubator managers, mentors, entrepreneurs across longitudinal timeframes.
- **2. How They Do It:** 60–90 min semi-structured interviews + committee observation + pitch logs + internal docs. Coded via Gioia / process-tracing.
- **3. Problems & Fixes (each expanded):**
  - *Problem: retrospective recall bias* — founders misremember early events → severity: MEDIUM → *Fix:* triangulate interviews with real-time archival records and meeting minutes
  - *Problem: researcher subjectivity* — investigator shapes interpretation → severity: HIGH → *Fix:* dual-coder inter-rater checks + Gioia audit trail
  - *Problem: no generalizability* — one case can't speak for all → severity: HIGH → *Fix:* multi-case comparative designs (successful vs stalled structures)
- **4. How You Apply It:** Article 2 — interviewing high vs low responders to trace the internal learning process.

## B4. QUANTITATIVE SURVEY (Self-Reported Perceptions)
- **1. Who Evaluates & What They Do:** Active founders evaluate themselves and perceived market standing via multi-item Likert scales.
- **2. How They Do It:** Structured digital questionnaires → CFA, SEM, cluster analysis.
- **3. Problems & Fixes (each expanded):**
  - *Problem: common-method variance* — IV and DV on the same survey → inflated correlations → severity: HIGH → *Fix:* temporal spacing between waves + negative control items
  - *Problem: social desirability* — founders overstate confidence → severity: MEDIUM → *Fix:* anonymized administration + indirect wording
  - *Problem: no causal direction* — correlation can't prove causality → severity: HIGH → *Fix:* anchor within an RCT framework (your design)
- **4. How You Apply It:** Core instrument for self-legitimacy (Bertrand) + perceived legitimacy (Alexiou & Wiggins).

## B5. SOCIAL REPRESENTATIONS SURVEY (Cognitive Mapping)
- **1. Who Evaluates & What They Do:** Cohorts of practicing entrepreneurs produce spontaneous word associations for "the legitimate entrepreneur."
- **2. How They Do It:** Respondents write 5 words + rank importance (1–5). Vergès structural matrix (frequency × rank) separates central core from peripheral beliefs.
- **3. Problems & Fixes (each expanded):**
  - *Problem: lexical ambiguity* — synonyms and varied phrasing fragment the data → severity: MEDIUM → *Fix:* standardized lemmatization + semantic grouping dictionaries
  - *Problem: small sample sensitivity* — rank orders unstable with few respondents → *Fix:* bootstrapped rank-order significance testing
  - *Problem: cross-language differences* — words don't translate 1:1 → *Fix:* comparative multi-group analysis (domestic vs international)
- **4. How You Apply It:** Rationale for treating the Franco-Italian context as containing distinct institutional reference frameworks.`,

qa: `# COMMITTEE DEFENSE Q&A — 12 Critical Questions & Empirical Model Answers
*Structured for rapid 30-second mastery: Model Answer (Core Claim + Two-Link Logic) → Backing Literature*

## SECTION A: THEORETICAL PUZZLE & GAP

### Q1: "Isn't your gap merely an absence of literature ('nobody did an RCT')?"
- **Model Answer:** No. It is a fundamental theoretical tension. Legitimacy is defined as an evaluation that resides strictly in the external stakeholder's mind, whereas entrepreneurship training operates strictly inside the founder. Existing theory cannot predict whether altering a founder's internal knowledge and signals will successfully bridge the boundary and change an external evaluator's proprietary judgment.
- **Backing Literature:** Mark Suchman (1995 AMR); Eric Schoon (2022 ASR); Sonia Siraz et al. (2023 JMS).

### Q2: "Why do you assume your novice founders start in 'Unknown' legitimacy rather than Illegitimacy?"
- **Model Answer:** Following Siraz et al. (2023), unknown legitimacy includes the *undecided* sub-state, where evaluators lack sufficient information to judge. Novice, unconventional founders possess no negative track record or stigma—they simply suffer from a lack of visibility and recognizable category fit. We do not assume this as a proven fact; we treat it as a theoretical expectation and empirically characterize baseline distributions at T0.
- **Backing Literature:** Siraz, Claes, De Castro & Vaara (2023 JMS, Table I); Thaler, Sievert, Siraz et al. (JMS Online First).

### Q3: "What if your experiment finds a null result—does your whole thesis fail?"
- **Model Answer:** Absolutely not; a null result is theoretically profound. It identifies an empirical boundary condition for entrepreneurship policy: proving that founder-side capability training cannot cross the evaluator boundary. As Claes et al. (2025) and Siraz et al. (2026) show, evaluator bias and perceived strategy appropriateness can override founder behavior. If training fails to move external judgments, it proves public policy must shift from founder training to evaluator-facing certification platforms.
- **Backing Literature:** Claes, Siraz et al. (2025 EMR); Siraz, Claes & Alvarez (2026 JBE); Bitektine & Haack (2015 AMJ).

### Q4: "What are your 5 training dimensions, and what does the intervention train?"
- **Model Answer:** Our 12-hour intervention trains **5 distinct legitimacy dimensions** (as established in our training design):
  - **1. Cognitive:** Clear positioning and category framing of the venture
  - **2. Pragmatic:** Demonstrating concrete value creation and client utility
  - **3. Social:** Building networks, ties, and social ease/vouching
  - **4. Factual:** Documenting expertise, track records, and operational milestones
  - **5. Regulative:** Regulatory compliance that goes beyond baseline legal minimums
  - *Theoretical Link:* These 5 trained dimensions operationalize Suchman's (1995) classical macro-dimensions by equipping founders with the specific behavioral signaling repertoires needed to generate external validity cues.
- **Backing Literature:** Mark Suchman (1995 AMR); Zimmerman & Zeitz (2002 AMR); Greg Fisher (2020 Org Theory); Alex Bitektine (2011 AMR).

## SECTION B: MEASUREMENT & OPERATIONALIZATION

### Q5: "Your dependent variable relies on founder self-report. Isn't that circular?"
- **Model Answer:** We explicitly acknowledge that our survey captures the founder-side node of Schoon's (2022) relational dyad. To ensure methodological rigor, we include objective stakeholder validation milestones, and our design incorporates two direct validation extensions: applying Ghods et al.'s (2026) computational text-analysis scoring to participants' written pitch decks, and executing a Siraz-style evaluator conjoint experiment in Article 4.
- **Backing Literature:** Eric Schoon (2022 ASR); Ghods, Ricard, Aldebert & Schoon (2026 BJM); Daisy Bertrand et al. (2025 HAL).

### Q6: "Why use Bertrand's Self-Legitimacy scale instead of standard General Self-Efficacy?"
- **Model Answer:** General self-efficacy measures a generalized belief in one's capability to execute tasks. In contrast, Bertrand's self-legitimacy instrument measures the entrepreneur's internalized feeling of social rightness, appropriateness, and entitlement to operate as a venture founder. As Bertrand, Benamara & Aldebert (2025) prove, self-illegitimacy specifically triggers impostor syndrome and suppresses action, making it the precise psychological mediator for our causal chain.
- **Backing Literature:** Daisy Bertrand, Benamara & Aldebert (2025 HAL); Alex Bitektine (2011 AMR); Michael Tost (2011 AMR).

### Q7: "How do you defend your construct validity against Common-Method Variance (CMV)?"
- **Model Answer:** We employ procedural and statistical remedies: (1) Temporal separation between Baseline (T0), Post-treatment (T1), and Follow-up (T4); (2) Separating self-legitimacy items from external stakeholder validation scales; and (3) Triangulating self-reports against objective textual artifacts scored via Ghods et al.'s (2026) multi-dimensional NLP method.
- **Backing Literature:** Podsakoff et al. (2003 JAP); Ghods, Ricard, Aldebert & Schoon (2026 BJM).

## SECTION C: ECOSYSTEM, MECHANISMS & BIAS

### Q8: "Is atEnA itself legitimate enough to confer legitimacy to its participants?"
- **Model Answer:** Aldebert's (2021, 2023) research demonstrates that support structures must establish their own institutional legitimacy before they can confer it. In our field RCT, atEnA's program-level standing and institutional backing (CCIs, regional universities) are held strictly constant between treatment and control cohorts, allowing us to isolate the specific incremental value-add of the 12h educational curriculum.
- **Backing Literature:** Bénédicte Aldebert (2021, 2023 AEI); Aldebert (2024 E&I).

### Q9: "How do you know your 5 capability categories won't backfire?"
- **Model Answer:** We do not assume they will succeed ex-ante. Claes, Siraz et al. (2025) empirically demonstrated that legitimation strategies favored by an industry can be perceived as inappropriate by evaluators and actively backfire. That is precisely why our study is designed as an empirical field experiment: to test whether training these capabilities produces positive, neutral, or negative effects on evaluator judgments.
- **Backing Literature:** Claes, Siraz, De Castro & Lapeyre (2025 EMR); Siraz, Claes & De Castro (2026 EMR).

### Q10: "Won't structural bias (gender, ethnicity) override any training effect?"
- **Model Answer:** Siraz et al. (2020, 2026) demonstrate that women, immigrants, and ethnic minorities face persistent baseline legitimacy penalties. This is why our empirical analysis plan incorporates formal subgroup moderation: to test whether capability training can partially compensate for structural identity deficits, or whether evaluator bias imposes an insurmountable ceiling.
- **Backing Literature:** Sonia Siraz et al. (2020 AOM); Siraz, Claes & Alvarez (2026 JBE).

### Q11: "How do you account for institutional differences between France and Italy?"
- **Model Answer:** Ghods, Ricard & Aldebert (2024) show that social representations of the 'legitimate entrepreneur' vary across operating environments. Because norms, values, and beliefs (NVBs) differ across the Franco-Italian border, we model geographic site as a formal multi-group moderator rather than pooling cross-border data into a single homogeneous bucket.
- **Backing Literature:** Ghods, Ricard & Aldebert (2024 E&RD); Siraz et al. (2023 JMS).

### Q12: "Why did you choose a 12-hour module instead of a multi-month incubator program?"
- **Model Answer:** A focused 12-hour intervention provides high experimental fidelity and clean causal identification. In long, multi-month incubation programs, treatments become confounded with peer effects, ad-hoc mentoring, and external market shocks. A 12-hour structured curriculum allows us to cleanly isolate the direct causal impact of codified legitimation training on entrepreneurial self-perception and signaling behavior.
- **Backing Literature:** McKenzie & Woodruff (2014 World Bank); Anderson et al. (2018 Management Science); Greg Fisher (2020 Org Theory).`,

## 2. Thaler, Sievert, Siraz, Claes & Pinz (Online First) — JMS

- **Sample / Context:** 1,866 evaluators in two factorial survey studies
- **Design & Method:** 2 Factorial Survey Experiments testing authorization, endorsement, and category cues
- **Core Claim:** Categorical fit and cue valence shape individual propriety beliefs

- **Focus:** Cue Congruence and Evaluator Values in Contested Fields

states: `# THE 5 LEGITIMACY STATES — JMS 2023 Deep-Dive
*Siraz, Claes, De Castro & Vaara (2023), Journal of Management Studies*

## 1. LEGITIMACY (Full Acceptance)
- **Definition:** Favorable judgments; venture is taken-for-granted, desirable, proper, and appropriate within prevailing NVBs
- **Congruence:** Strong alignment with prevailing norms, values, and beliefs
- **Opposition:** Passive / Dormant — unable to mobilize institutional validation
- **Evaluation Mode:** Passive cognitive processing (taken for granted)
- **Prescribed Strategies:** Framing (maintain buffer), Mythopoesis, Normalization, Historical Theorization
- **Cautionary Rule:** Overt defense of a taken-for-granted venture can backfire by drawing unnecessary scrutiny

## 2. CONDITIONAL LEGITIMACY ("Legitimate IF...")
- **Definition:** Evaluators accept the venture in principle, but impose explicit, binding constraints
- **Congruence:** Conditional upon compliance with specific boundaries (e.g., GMOs permitted only with labeling)
- **Opposition:** Active — capable of mounting validated counterarguments if conditions are breached
- **Evaluation Mode:** Active cognitive scrutiny; tensions exist between regulatory, pragmatic, and moral legitimacy
- **Prescribed Strategies:** Authorization, Rationalization (redefining means-ends), Self-Regulation, Commitment Narratives

## 3. UNKNOWN LEGITIMACY (The Novice Founder's State)
*Evaluators lack the basis to form a stable legitimacy verdict — 3 distinct sub-types:*
### A. Undetermined
- Evaluators are disengaged or uninterested; no evaluation has been initiated
- **Strategy:** Emotional framing, high-visibility storytelling, building baseline salience
### B. Undecided (Where ATENA Founders Start)
- Evaluators cannot judge due to missing information, information overload, or ambiguous signals
- **Strategy:** Analogical reasoning (frame unknown as familiar), role models, authorized intermediaries
- **Direct Connection:** ATENA training acts as the analogical framing mechanism + program endorsement
### C. Polarized
- Deeply divided evaluator base; two opposing sub-collectives co-exist in balance ("weak validity")
- **Strategy:** Bridging narratives, dual-framing tailored to distinct audience segments

## 4. CONDITIONAL ILLEGITIMACY ("Illegitimate BUT Tolerated")
- **Definition:** Venture is judged improper in principle, but granted an exception due to mitigating conditions
- **Congruence:** Fundamentally incongruent, but saved by pragmatic necessity or regulatory carve-outs (e.g., Medical Cannabis)
- **Opposition:** Active against granting the exception
- **Evaluation Mode:** Active; persistent tension between moral rejection and pragmatic acceptance
- **Prescribed Strategies:** Authorized Exception (appealing to formal dispensations), Higher-Good Moralization

## 5. ILLEGITIMACY (Active Rejection)
- **Definition:** Unfavorable judgments; venture is actively rejected, sanctioned, or stigmatized
- **Congruence:** Severe incongruence with prevailing societal norms, values, and beliefs
- **Opposition:** Institutionalized and active; negative judgments possess high cognitive stickiness
- **Evaluation Mode:** Passive or ritualized rejection
- **Prescribed Strategies:** Impression management, Decoupling, Normalization accounts, Relocating to favorable jurisdictions

- **Trigger:** Venture enters a new environment or market
- **Determinants:** Stability of Reference Framework × Presence of Type Conflicts × Strength of Societal NVBs
