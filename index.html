punchlines: `# LEGITIMACY FIELD — Systematic Summary (Verdict First)
*Uniform 4-line structure: 1. Verdict & Effect Direction → 2. Sample, Setting & Timeframe → 3. Methodology & Robustness → 4. How You Use It in Thesis*

## CORE CONSTRUCTS (The Master Vocabulary)
- **Propriety** = Micro-level individual evaluator belief
- **Validity** = Macro-level institutionalized collective acceptance
- **Consensus** = Meso-level agreement across evaluators
- **Reference Framework** = Issue-specific norms, values, and beliefs (NVBs) against which subjects are evaluated

## SIRAZ (Evaluator Cognition, Cues & Bias)

### JMS online first: "Looking Like a Real Business Beats Endorsements"
- **1. Verdict:** ✅ YES, CONFIRMED (Statistically Significant) — Categorical fit is the #1 strongest driver of propriety; negative cues have stronger penalizing impact than positive cues help
- **2. Sample & Setting:** 1,866 evaluators across 2 separate experimental studies evaluating nascent venture profiles
- **3. Methodology & Robustness:** Factorial Survey Experiment (Randomized orthogonal vignette manipulation); robust causal identification isolating category fit vs authorization vs endorsement cues
- **4. How you use it:** Directly justifies the cognitive-positioning capability in your 12h module as your primary high-leverage training component

### EMR 2026: "Contradictory Signals Leave Evaluators Stuck in the Middle"
- **1. Verdict:** ✅ YES, CONFIRMED (Statistically Significant) — Incongruent cue bundles produce unresolved intermediate "grey area" judgments; evaluators discount cues conflicting with their personal values
- **2. Sample & Setting:** 247 evaluators making 3,952 evaluations in France & Spain (Fracking energy sector)
- **3. Methodology & Robustness:** Full-profile Conjoint Experiment; high statistical power (3,952 judgments nested in 247 judges) with multilevel interaction modeling for evaluator environmentalism
- **4. How you use it:** Proves your 12h training must teach **cue coherence** across all 5 capabilities, not just signal volume

### EMR 2025: "Legitimation Strategies Can Backfire if Audience Disapproves"
- **1. Verdict:** ⚠️ YES, CONFIRMED-NEGATIVE (Backfire Effect) — Industry-favored legitimation strategies were judged improper by external evaluators and actively damaged venture legitimacy
- **2. Sample & Setting:** French foie gras sector: qualitative interviews with producers + 3 industry associations, followed by 31 evaluators × 32 profiles (992 total evaluations)
- **3. Methodology & Robustness:** Mixed Methods (Qualitative thematic extraction + Conjoint experiment); robust identification of strategy appropriateness, though evaluator sample is focused (n=31)
- **4. How you use it:** Proves you cannot assume training capabilities automatically help; inappropriate founder signaling hurts, which is why your field RCT is required

### AOM 2020: "Failed Women & Immigrant Founders Face a Legitimacy Penalty"
- **1. Verdict:** ✅ YES, CONFIRMED (Statistically Significant) — Minorities face harsher post-failure penalties; formal education offsets significantly less penalty for minority founders
- **2. Sample & Setting:** 74 evaluators evaluating 2,368 post-failure entrepreneurial scenarios
- **3. Methodology & Robustness:** Conjoint Experiment manipulating founder gender, immigrant status, education, and failure severity with multilevel regression
- **4. How you use it:** Provides the empirical justification for subgroup moderation analyses in ATENA to test if training offsets structural identity barriers

### JBE 2026: "Ethnic Bias Sits in the Evaluation System, Not Just Prejudiced Individuals"
- **1. Verdict:** ✅ YES, CONFIRMED (Counterintuitive & Statistically Significant) — Latinx founders rated lower in funding-worthiness even with equal/lower debt; Latinx evaluators were not more lenient
- **2. Sample & Setting:** 781 US evaluators making 12,496 funding-worthiness judgments of post-failure entrepreneurs
- **3. Methodology & Robustness:** Full-profile Conjoint Experiment; massive dataset (12,496 ratings) providing gold-standard statistical power and robustness against unobserved heterogeneity
- **4. How you use it:** Proves your target population faces structural baseline legitimacy deficits, justifying specialized entrepreneurship interventions

### JMS 2023: "Legitimacy is Not Binary — It Spans 5 Distinct Qualitative States"
- **1. Verdict:** 💡 THEORY / PROPOSED (Conceptual Contribution, No Empirical Test) — Legitimacy is not a 1-dimensional scale; it spans 5 qualitatively distinct states governed by reference framework stability
- **2. Sample & Setting:** Pure theoretical synthesis of 50+ years of institutional and legitimacy literature (Suchman, Tost, Bitektine, Vaara)
- **3. Methodology & Robustness:** Deductive Conceptual Modeling & Discursive Typology (Standard theoretical methodology for Journal of Management Studies)
- **4. How you use it:** Theoretical foundation for arguing novice founders begin in **Unknown (Undecided)** legitimacy, and training functions as a state-transition mechanism

## ALDEBERT & ECOSYSTEM (Support Structures & Legitimacy Transfer)

### AEI 2021/2023: "An Accelerator Must Build Its Own Legitimacy Before It Can Transfer It"
- **1. Verdict:** ✅ YES, CONFIRMED-CONDITIONAL (Qualitative Mechanism) — Accelerators transfer legitimacy in sequential stages, but repeated mobilization mechanisms experience audience fatigue and decay
- **2. Sample & Setting:** 1 regional accelerator in South of France tracked longitudinally across 2020–2022 fieldwork
- **3. Methodology & Robustness:** Longitudinal Qualitative Case Study (In-depth semi-structured interviews, participant observation, archival documents); high contextual validity
- **4. How you use it:** atEnA is an accelerator/support structure; your experimental baseline holds program legitimacy constant to isolate the module's incremental effect

### E&I 2024: "Large Corporations Are the Missing Bridge for Deeptech Legitimacy"
- **1. Verdict:** ✅ YES, CONFIRMED (Qualitative Mechanism) — Public incubators provide capital but cannot confer commercial legitimacy; corporate partnerships bridge the legitimacy gap
- **2. Sample & Setting:** 2 French University Incubators and affiliated deeptech startup spin-offs
- **3. Methodology & Robustness:** Comparative Multi-case Qualitative Field Study (Interviews with incubator directors, technology transfer officers, and founders)
- **4. How you use it:** Contextualizes atEnA's institutional partner network (Chambers of Commerce, regional industrial partners) as external legitimacy bridges

### E&RD 2024: "The Mental Model of a 'Legitimate Entrepreneur' Changes by Context"
- **1. Verdict:** ✅ YES, CONFIRMED (Statistically Significant Differences) — Domestic vs international entrepreneurs hold structurally divergent cognitive representations of what constitutes a legitimate enterprise
- **2. Sample & Setting:** 150 French entrepreneurs surveyed across domestic and international operational settings
- **3. Methodology & Robustness:** Social Representations Survey (Structural core-periphery cognitive analysis comparing rank-order associative frequency)
- **4. How you use it:** Rationale for modeling cross-border regional context (France vs Italy) as a formal moderator rather than pooling data blindly

### BJM 2026: "Legitimacy Can Be Scored Directly from Venture Texts and Predicts Failure"
- **1. Verdict:** ✅ YES, CONFIRMED (Validated Metric & Outcome Prediction) — Multidimensional textual legitimacy scores extracted from venture communications reliably predict venture survival vs failure
- **2. Sample & Setting:** Large corporate communications corpus paired with objective longitudinal firm survival tracking (Ghods, Ricard, Aldebert & Schoon)
- **3. Methodology & Robustness:** Computational Text Analysis on Object–Audience Dyads; validated against expert human ratings and out-of-sample venture failure econometrics
- **4. How you use it:** Provides an objective methodological escape hatch to address common-method variance (coding participant pitch decks and applications directly)

### HAL 2025: "Feeling Illegitimate Triggers Impostor Syndrome and Paralyzes Founders"
- **1. Verdict:** ⚠️ YES, CONFIRMED (Cross-Sectional Association) — Internalized feelings of illegitimacy foster impostor syndrome, directly suppressing entrepreneurial action and intention
- **2. Sample & Setting:** 122 Aix-Marseille University economics and management students and nascent student entrepreneurs
- **3. Methodology & Robustness:** Quantitative Survey & Cluster Analysis (Cross-sectional design; establishes psychological correlation, not longitudinal causality)
- **4. How you use it:** Direct empirical precedent for adopting Daisy Bertrand's self-legitimacy scale as your central psychological mediator

## SCHOON & GHODS (Operationalization & The Dyad)

### Schoon 2022 (ASR): "Legitimacy Lives Only in the Dyad: Object + Audience + Relation"
- **1. Verdict:** 💡 THEORY / PROPOSED (Adopted Field Standard, ~140 Citations) — Legitimacy is strictly a relational dyad requiring Expectations + Assent + Conformity; without both nodes, it is merely prestige or reputation
- **2. Sample & Setting:** Definitive sociological synthesis across 50+ years of social science literature
- **3. Methodology & Robustness:** Relational Sociological Theory Synthesis (American Sociological Review standard)
- **4. How you use it:** Accurately defines your survey boundary as the founder-perceived node of Schoon's dyad, turning a potential critique into an informed design choice

### Ghods 2021 (PhD Thesis): "Operationalize → Measure → Test Moderation Arc"
- **1. Verdict:** ✅ YES, CONFIRMED (Econometric Panel Significance) — Entrepreneurial legitimacy positively moderates the relationship between internationalization and venture performance
- **2. Sample & Setting:** 67 Biotech SMEs scored; 412 longitudinal observations (Directed by Aldebert & Ricard; Dissertation Jury: Alex Bitektine)
- **3. Methodology & Robustness:** Mixed Methods Multi-Essay Thesis: Cognitive mapping + Scale construction + Panel econometric moderation
- **4. How you use it:** Ghods provides the measurement and validation template; your thesis completes the missing link by adding an **experimental training intervention**

## THE THESIS CONTRIBUTION & JUNCTION
- **1. The Evaluator Side:** Siraz proved how evaluators cognitively process cues inside their heads
- **2. The Channel Side:** Aldebert proved how incubators and ecosystems transfer legitimacy
- **3. The Measurement Side:** Schoon & Ghods proved how to operationalize the relational dyad
- **4. YOUR ATENA THESIS:** You execute the missing **Field RCT** — testing whether training the founder actually shifts the external legitimacy judgment conferred by the evaluator`,

family: `# THE SCHOLARLY NETWORK & MASTER CANON (Structured Breakdown)
*Uniform 4-line structure: 1. Research Question → 2. Core Finding / Verdict → 3. Methodology & Epistemic Base → 4. How You Use It in Thesis*

- **1. Question:** What is organizational legitimacy, and what distinct forms does it take when managed strategically?

qa: `# COMMITTEE DEFENSE Q&A — 12 Critical Questions & Empirical Model Answers
*Structured for rapid 30-second mastery: Model Answer (Core Claim + Two-Link Logic) → Backing Literature*

## SECTION A: THEORETICAL PUZZLE & GAP

### Q1: "Isn't your gap merely an absence of literature ('nobody did an RCT')?"
- **Model Answer:** No. It is a fundamental theoretical tension. Legitimacy is defined as an evaluation that resides strictly in the external stakeholder's mind, whereas entrepreneurship training operates strictly inside the founder. Existing theory cannot predict whether altering a founder's internal knowledge and signals will successfully bridge the boundary and change an external evaluator's proprietary judgment.
- **Backing Literature:** Mark Suchman (1995 AMR); Eric Schoon (2022 ASR); Sonia Siraz et al. (2023 JMS).

### Q2: "Why do you assume your novice founders start in 'Unknown' legitimacy rather than Illegitimacy?"
- **Model Answer:** Following Siraz et al. (2023), unknown legitimacy includes the *undecided* sub-state, where evaluators lack sufficient information to judge. Novice, unconventional founders possess no negative track record or stigma—they simply suffer from a lack of visibility and recognizable category fit. We do not assume this as a proven fact; we treat it as a theoretical expectation and empirically characterize baseline distributions at T0.
- **Backing Literature:** Siraz, Claes, De Castro & Vaara (2023 JMS, Table I); Thaler, Sievert, Siraz et al. (JMS Online First).

### Q3: "What if your experiment finds a null result—does your whole thesis fail?"
- **Model Answer:** Absolutely not; a null result is theoretically profound. It identifies an empirical boundary condition for entrepreneurship policy: proving that founder-side capability training cannot cross the evaluator boundary. As Claes et al. (2025) and Siraz et al. (2026) show, evaluator bias and perceived strategy appropriateness can override founder behavior. If training fails to move external judgments, it proves public policy must shift from founder training to evaluator-facing certification platforms.
- **Backing Literature:** Claes, Siraz et al. (2025 EMR); Siraz, Claes & Alvarez (2026 JBE); Bitektine & Haack (2015 AMJ).

### Q4: "How does your 12-hour training relate to Suchman's 3 legitimacy dimensions?"
- **Model Answer:** Suchman (1995) defined pragmatic, moral, and cognitive legitimacy. Our 12h module operationalizes all three: Cognitive legitimacy is targeted via categorical positioning and business model framing; Pragmatic legitimacy via factual milestones, credentials, and financial documentation; and Moral/Normative legitimacy via regulatory compliance and stakeholder engagement.
- **Backing Literature:** Mark Suchman (1995 AMR); Zimmerman & Zeitz (2002 AMR); Greg Fisher (2020 Org Theory).

## SECTION B: MEASUREMENT & OPERATIONALIZATION

### Q5: "Your dependent variable relies on founder self-report. Isn't that circular?"
- **Model Answer:** We explicitly acknowledge that our survey captures the founder-side node of Schoon's (2022) relational dyad. To ensure methodological rigor, we include objective stakeholder validation milestones, and our design incorporates two direct validation extensions: applying Ghods et al.'s (2026) computational text-analysis scoring to participants' written pitch decks, and executing a Siraz-style evaluator conjoint experiment in Article 4.
- **Backing Literature:** Eric Schoon (2022 ASR); Ghods, Ricard, Aldebert & Schoon (2026 BJM); Daisy Bertrand et al. (2025 HAL).

### Q6: "Why use Bertrand's Self-Legitimacy scale instead of standard General Self-Efficacy?"
- **Model Answer:** General self-efficacy measures a generalized belief in one's capability to execute tasks. In contrast, Bertrand's self-legitimacy instrument measures the entrepreneur's internalized feeling of social rightness, appropriateness, and entitlement to operate as a venture founder. As Bertrand, Benamara & Aldebert (2025) prove, self-illegitimacy specifically triggers impostor syndrome and suppresses action, making it the precise psychological mediator for our causal chain.
- **Backing Literature:** Daisy Bertrand, Benamara & Aldebert (2025 HAL); Alex Bitektine (2011 AMR); Michael Tost (2011 AMR).

### Q7: "How do you defend your construct validity against Common-Method Variance (CMV)?"
- **Model Answer:** We employ procedural and statistical remedies: (1) Temporal separation between Baseline (T0), Post-treatment (T1), and Follow-up (T4); (2) Separating self-legitimacy items from external stakeholder validation scales; and (3) Triangulating self-reports against objective textual artifacts scored via Ghods et al.'s (2026) multi-dimensional NLP method.
- **Backing Literature:** Podsakoff et al. (2003 JAP); Ghods, Ricard, Aldebert & Schoon (2026 BJM).

## SECTION C: ECOSYSTEM, MECHANISMS & BIAS

### Q8: "Is atEnA itself legitimate enough to confer legitimacy to its participants?"
- **Model Answer:** Aldebert's (2021, 2023) research demonstrates that support structures must establish their own institutional legitimacy before they can confer it. In our field RCT, atEnA's program-level standing and institutional backing (CCIs, regional universities) are held strictly constant between treatment and control cohorts, allowing us to isolate the specific incremental value-add of the 12h educational curriculum.
- **Backing Literature:** Bénédicte Aldebert (2021, 2023 AEI); Aldebert (2024 E&I).

### Q9: "How do you know your 5 capability categories won't backfire?"
- **Model Answer:** We do not assume they will succeed ex-ante. Claes, Siraz et al. (2025) empirically demonstrated that legitimation strategies favored by an industry can be perceived as inappropriate by evaluators and actively backfire. That is precisely why our study is designed as an empirical field experiment: to test whether training these capabilities produces positive, neutral, or negative effects on evaluator judgments.
- **Backing Literature:** Claes, Siraz, De Castro & Lapeyre (2025 EMR); Siraz, Claes & De Castro (2026 EMR).

### Q10: "Won't structural bias (gender, ethnicity) override any training effect?"
- **Model Answer:** Siraz et al. (2020, 2026) demonstrate that women, immigrants, and ethnic minorities face persistent baseline legitimacy penalties. This is why our empirical analysis plan incorporates formal subgroup moderation: to test whether capability training can partially compensate for structural identity deficits, or whether evaluator bias imposes an insurmountable ceiling.
- **Backing Literature:** Sonia Siraz et al. (2020 AOM); Siraz, Claes & Alvarez (2026 JBE).

### Q11: "How do you account for institutional differences between France and Italy?"
- **Model Answer:** Ghods, Ricard & Aldebert (2024) show that social representations of the 'legitimate entrepreneur' vary across operating environments. Because norms, values, and beliefs (NVBs) differ across the Franco-Italian border, we model geographic site as a formal multi-group moderator rather than pooling cross-border data into a single homogeneous bucket.
- **Backing Literature:** Ghods, Ricard & Aldebert (2024 E&RD); Siraz et al. (2023 JMS).

### Q12: "Why did you choose a 12-hour module instead of a multi-month incubator program?"
- **Model Answer:** A focused 12-hour intervention provides high experimental fidelity and clean causal identification. In long, multi-month incubation programs, treatments become confounded with peer effects, ad-hoc mentoring, and external market shocks. A 12-hour structured curriculum allows us to cleanly isolate the direct causal impact of codified legitimation training on entrepreneurial self-perception and signaling behavior.
- **Backing Literature:** McKenzie & Woodruff (2014 World Bank); Anderson et al. (2018 Management Science); Greg Fisher (2020 Org Theory).`,

cards: `# DETAILED RESEARCH CARDS
*7-line structured breakdown per study*

## 1. Siraz, Claes, De Castro & Vaara (2023) — JMS
- **Focus:** The Grey Area between Legitimacy and Illegitimacy
- **Sample / Context:** Pure theoretical synthesis; no empirical sample
- **Design & Method:** Conceptual framework and deductive typology
- **Core Claim:** Legitimacy is not a binary scale; actors occupy 5 qualitatively distinct states
- **Verdict:** 💡 PROPOSED (Theoretical framework)
- **Empirical Finding:** Framework formalizes 5 states, state-specific discursive strategies, and dynamic transitions driven by reference framework shifts
- **Use in Thesis:** Theoretical foundation for arguing novice founders start in Unknown/Undecided state

## 2. Thaler, Sievert, Siraz, Claes & Pinz (Online First) — JMS
- **Focus:** Microlevel Judgments: Validity Cues and Categorical Fit
- **Sample / Context:** 1,866 evaluators in two factorial survey studies
- **Design & Method:** 2 Factorial Survey Experiments testing authorization, endorsement, and category cues
- **Core Claim:** Categorical fit and cue valence shape individual propriety beliefs
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Categorical fit is the dominant predictor; negative cues have stronger impact than positive cues
- **Use in Thesis:** Justifies cognitive-positioning as the primary capability in ATENA training

## 3. Siraz, Claes & De Castro (2026) — EMR
- **Focus:** Cue Congruence and Evaluator Values in Contested Fields
- **Sample / Context:** 247 evaluators making 3,952 evaluations (France & Spain fracking sector)
- **Design & Method:** Full-profile Conjoint Experiment with 4 cue types (regulatory, pragmatic, normative, cognitive)
- **Core Claim:** Cue congruence and cue-value congruence determine individual propriety
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Incongruent cues produce intermediate evaluations; personal environmentalism discounts pro-industry cues
- **Use in Thesis:** Motivates why training must deliver coherent, non-contradictory cue bundles

## 4. Claes, Siraz, De Castro & Lapeyre (2025) — EMR
- **Focus:** Legitimation Strategies & Audience Appropriateness in Foie Gras
- **Sample / Context:** French foie gras sector: producer interviews + 31 evaluators × 32 profiles (992 evaluations)
- **Design & Method:** Mixed Methods: Qualitative strategy extraction + Conjoint experiment
- **Core Claim:** Legitimation strategies must be perceived as appropriate to be effective
- **Verdict:** ⚠️ CONFIRMED-NEGATIVE (Strategies can backfire)
- **Empirical Finding:** Industry-favored legitimation strategies backfired when evaluators viewed the strategy itself as improper
- **Use in Thesis:** Explains why training effects must be empirically tested rather than assumed positive

## 5. Siraz, Claes et al. (2020) — AOM / BCERC
- **Focus:** Legitimacy Judgments of Entrepreneurial Failures
- **Sample / Context:** 74 evaluators reviewing 2,368 failed venture profiles
- **Design & Method:** Conjoint Experiment manipulating founder gender, immigrant status, education, and failure context
- **Core Claim:** Founder demographic characteristics bias post-failure legitimacy assessments
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Women and immigrant founders face harsher legitimacy penalties; education offsets less penalty for minorities
- **Use in Thesis:** Theoretical rationale for testing heterogeneous treatment effects across founder subgroups

## 6. Siraz, Claes & Alvarez (2026) — JBE
- **Focus:** Funding-Worthiness Assessments of Latinx vs White Entrepreneurs
- **Sample / Context:** 781 US evaluators making 12,496 funding decisions
- **Design & Method:** Large-scale Full-profile Conjoint Experiment
- **Core Claim:** Systemic ethnic bias influences resource allocation evaluations post-failure
- **Verdict:** ✅ CONFIRMED (Counterintuitive)
- **Empirical Finding:** Latinx founders rated less funding-worthy despite equal/lower debt; Latinx evaluators were not more lenient
- **Use in Thesis:** Demonstrates that unconventional founders face structural deficits embedded in evaluator reference frameworks

## 7. Aldebert (2021, 2023) — AEI
- **Focus:** Legitimacy Transfer Mechanics in Early-Stage Accelerators
- **Sample / Context:** 1 regional accelerator in South of France (2020–2022 fieldwork)
- **Design & Method:** Longitudinal Qualitative Case Study (Interviews, observation, documents)
- **Core Claim:** Support structures transfer legitimacy sequentially, but require internal legitimacy first
- **Verdict:** ✅ CONFIRMED-CONDITIONAL
- **Empirical Finding:** Legitimation mechanisms evolve across lifecycle phases; repetitive audience mobilization mechanisms experience exhaustion
- **Use in Thesis:** Establishes that atEnA's institutional standing is a necessary condition for legitimacy transfer

## 8. Aldebert (2024) — E&I
- **Focus:** Deeptech Legitimacy Transfer & The Corporate Missing Link
- **Sample / Context:** 2 French University Incubators and deeptech startup spin-offs
- **Design & Method:** Multi-case Qualitative Field Study
- **Core Claim:** Intermediaries alone cannot bridge deeptech ventures to commercial legitimacy
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Established industrial/corporate partners act as the essential bridge for legitimacy transfer
- **Use in Thesis:** Contextualizes atEnA's partner network (CCIs, regional industry) as legitimacy bridges

## 9. Ghods, Ricard & Aldebert (2024) — E&RD
- **Focus:** Social Representations of the "Legitimate Entrepreneur"
- **Sample / Context:** 150 French entrepreneurs (domestic vs international)
- **Design & Method:** Quantitative Social Representations Survey (Core-periphery analysis)
- **Core Claim:** Legitimacy definitions are collective images that vary across operating contexts
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Domestic and international entrepreneurs hold distinct, context-specific representations of legitimacy
- **Use in Thesis:** Rationale for modeling the Franco-Italian cross-border context as a moderator

## 10. Ghods, Ricard, Aldebert & Schoon (2026) — BJM
- **Focus:** Multi-Dimensional Textual Measurement of New Venture Legitimacy
- **Sample / Context:** Corporate communications corpus paired with venture survival tracking
- **Design & Method:** Computational Text Analysis on Object–Audience Dyads
- **Core Claim:** Legitimacy can be extracted from textual artifacts at scale and predicts firm outcomes
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Multi-dimensional textual metrics validated against expert evaluations and reliably predict venture failure
- **Use in Thesis:** Provides a validated method to score founder pitch texts and overcome common-method variance

## 11. Bertrand, Benamara & Aldebert (2025) — HAL
- **Focus:** Illegitimacy Feelings, Impostor Syndrome & Entrepreneurial Intention
- **Sample / Context:** 122 AMU students and nascent student entrepreneurs
- **Design & Method:** Quantitative Survey & Cluster Analysis
- **Core Claim:** Internal feelings of illegitimacy inhibit entrepreneurial intentions via impostor syndrome
- **Verdict:** ⚠️ CONFIRMED (Cross-sectional)
- **Empirical Finding:** Identified 3 student profiles where low self-legitimacy acts as a direct psychological barrier to action
- **Use in Thesis:** Direct validation for using Daisy Bertrand's self-legitimacy instrument as the central mediator

## 12. Schoon (2022) — ASR
- **Focus:** Operationalizing Legitimacy as a Relational Dyad
- **Sample / Context:** Broad synthesis across sociology, political science, and organizational theory
- **Design & Method:** Relational Conceptual Synthesis
- **Core Claim:** Legitimacy exists only within an object–audience dyad requiring expectations, assent, and conformity
- **Verdict:** 💡 PROPOSED (Adopted standard)
- **Empirical Finding:** Clarifies the boundary between legitimacy and related social evaluations (reputation, prestige, status)
- **Use in Thesis:** Framework for stating that ATENA measures the founder-side node of the relational dyad`,

states: `# THE 5 LEGITIMACY STATES — JMS 2023 Deep-Dive
*Siraz, Claes, De Castro & Vaara (2023), Journal of Management Studies*

## 1. LEGITIMACY (Full Acceptance)
- **Definition:** Favorable judgments; venture is taken-for-granted, desirable, proper, and appropriate within prevailing NVBs
- **Congruence:** Strong alignment with prevailing norms, values, and beliefs
- **Opposition:** Passive / Dormant — unable to mobilize institutional validation
- **Evaluation Mode:** Passive cognitive processing (taken for granted)
- **Prescribed Strategies:** Framing (maintain buffer), Mythopoesis, Normalization, Historical Theorization
- **Cautionary Rule:** Overt defense of a taken-for-granted venture can backfire by drawing unnecessary scrutiny

## 2. CONDITIONAL LEGITIMACY ("Legitimate IF...")
- **Definition:** Evaluators accept the venture in principle, but impose explicit, binding constraints
- **Congruence:** Conditional upon compliance with specific boundaries (e.g., GMOs permitted only with labeling)
- **Opposition:** Active — capable of mounting validated counterarguments if conditions are breached
- **Evaluation Mode:** Active cognitive scrutiny; tensions exist between regulatory, pragmatic, and moral legitimacy
- **Prescribed Strategies:** Authorization, Rationalization (redefining means-ends), Self-Regulation, Commitment Narratives

## 3. UNKNOWN LEGITIMACY (The Novice Founder's State)
*Evaluators lack the basis to form a stable legitimacy verdict — 3 distinct sub-types:*
### A. Undetermined
- Evaluators are disengaged or uninterested; no evaluation has been initiated
- **Strategy:** Emotional framing, high-visibility storytelling, building baseline salience
### B. Undecided (Where ATENA Founders Start)
- Evaluators cannot judge due to missing information, information overload, or ambiguous signals
- **Strategy:** Analogical reasoning (frame unknown as familiar), role models, authorized intermediaries
- **Direct Connection:** ATENA training acts as the analogical framing mechanism + program endorsement
### C. Polarized
- Deeply divided evaluator base; two opposing sub-collectives co-exist in balance ("weak validity")
- **Strategy:** Bridging narratives, dual-framing tailored to distinct audience segments

## 4. CONDITIONAL ILLEGITIMACY ("Illegitimate BUT Tolerated")
- **Definition:** Venture is judged improper in principle, but granted an exception due to mitigating conditions
- **Congruence:** Fundamentally incongruent, but saved by pragmatic necessity or regulatory carve-outs (e.g., Medical Cannabis)
- **Opposition:** Active against granting the exception
- **Evaluation Mode:** Active; persistent tension between moral rejection and pragmatic acceptance
- **Prescribed Strategies:** Authorized Exception (appealing to formal dispensations), Higher-Good Moralization

## 5. ILLEGITIMACY (Active Rejection)
- **Definition:** Unfavorable judgments; venture is actively rejected, sanctioned, or stigmatized
- **Congruence:** Severe incongruence with prevailing societal norms, values, and beliefs
- **Opposition:** Institutionalized and active; negative judgments possess high cognitive stickiness
- **Evaluation Mode:** Passive or ritualized rejection
- **Prescribed Strategies:** Impression management, Decoupling, Normalization accounts, Relocating to favorable jurisdictions

## DYNAMIC SHIFTS (Figure 2 in Paper)
- **Trigger:** Venture enters a new environment or market
- **Determinants:** Stability of Reference Framework × Presence of Type Conflicts × Strength of Societal NVBs
- **Key Insight:** A venture's legitimacy state can flip from legitimate to contested without any change in its own behavior, solely because the societal yardstick shifted`,

thesis: `# THESIS ARGUMENT MAP — Paper-to-Chapter Guide

## 1. INTRODUCTION & MOTIVATION
- **Core Argument:** Unconventional and novice founders face a structural, non-meritocratic legitimacy deficit that paralyzes action
- **Papers to Cite:**
  - Siraz et al. (JBE 2026): Proves ethnicity penalty persists holding debt and financials constant
  - Siraz et al. (AOM 2020): Shows credentials compensate less for minority/immigrant founders
  - Bertrand, Benamara & Aldebert (2025): Proves feeling illegitimate suppresses entrepreneurial intention
- **Key Phrasing:** *"The legitimacy hurdle is documented to be structural rather than merit-based..."*

## 2. THEORETICAL FRAMEWORK
- **Core Argument:** Legitimacy is a multi-state relational judgment; training represents a transition from Unknown/Undecided to Conditional/Full Legitimacy
- **Papers to Cite:**
  - Siraz et al. (JMS 2023): 5-state framework (Cite as theoretical/proposed)
  - Schoon (ASR 2022): Relational dyad requiring expectations, assent, and conformity
  - Suchman (AMR 1995): Foundational pragmatic, moral, and cognitive dimensions
- **Key Phrasing:** *"We conceptualize novice ventures as occupying unknown legitimacy, specifically the undecided sub-state..."*

## 3. MECHANISMS & HYPOTHESES
- **Core Argument:** Evaluators judge via cues where categorical fit dominates; training improves cue emission and bundle coherence
- **Papers to Cite:**
  - Thaler, Siraz et al. (JMS Online First): Categorical fit is the #1 predictor of propriety
  - Siraz et al. (EMR 2026): Incongruent cue bundles stall evaluators in intermediate states
  - Aldebert (AEI 2021/2023): Support structures transfer legitimacy sequentially
- **Key Phrasing:** *"Training targets categorical fit while ensuring cue coherence across capability dimensions..."*

## 4. COUNTER-ARGUMENTS & BOUNDARY CONDITIONS
- **Core Argument:** Legitimation attempts are themselves evaluated; inappropriate strategies backfire, and structural bias may cap training effects
- **Papers to Cite:**
  - Claes, Siraz et al. (EMR 2025): Legitimation strategies backfire when perceived as improper
  - Siraz et al. (JBE 2026 / AOM 2020): Bias embedded in reference frameworks creates potential ceiling effects
- **Key Phrasing:** *"A null or heterogeneous treatment effect is theoretically informative rather than an empirical failure..."*

## 5. METHODOLOGY & MEASUREMENT DEFENSE
- **Core Argument:** Perceptual scales capture the founder node of the dyad; text analysis and conjoint designs represent natural validation extensions
- **Papers to Cite:**
  - Schoon (ASR 2022): The relational dyad as the proper unit of analysis
  - Ghods, Ricard, Aldebert & Schoon (BJM 2026): Computational text scoring of venture communications
  - Ghods, Ricard & Aldebert (E&RD 2024): Contextual variation in legitimacy representations
- **Key Phrasing:** *"Our instrument captures the founder-side node of Schoon's relational dyad..."*

## 6. THE CORE GAP & CONTRIBUTION
- **Core Argument:** The literature has tested evaluator cognition (Siraz) and ecosystem transfer (Aldebert), but has never tested whether the founder can be trained via an RCT
- **Papers to Cite:** The complete network synthesis + Ghods (2021 PhD template)
- **Key Phrasing:** *"What remains untested is whether training the founder crosses the boundary into the evaluator's judgment..."*`
