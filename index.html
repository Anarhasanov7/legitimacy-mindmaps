punchlines: `# LEGITIMACY FIELD — Punchline Summary
*Each paper shows: Core Takeaway in Title → Sample & Setting → Method → Theoretical & Practical Implication*

## CORE FOUNDATIONS (The Vocabulary)
- **Propriety** = Individual evaluator's personal belief (Micro level)
- **Validity** = Collective taken-for-granted acceptance (Macro level)
- **Consensus** = Degree of agreement across evaluators (Meso level)
- **Reference Framework** = The specific norms, values, and beliefs (NVBs) against which ventures are judged

## SIRAZ (Evaluator Cognition & Bias)

### JMS online first: "Looking Like a Real Business Beats Endorsements"
- **Tested on:** 1,866 evaluators rating randomized venture profiles (2 experimental studies)
- **Method:** 2 Factorial Survey Experiments (Standard causal design in management)
- **Verdict:** ✅ CONFIRMED — Categorical fit is the #1 strongest predictor of legitimacy; negative cues hurt more than positive cues help
- **What it means for you:** Your 12h module's cognitive positioning / category framing is your highest-leverage training component

### EMR 2026: "Contradictory Signals Leave Evaluators Stuck in the Middle"
- **Tested on:** 247 evaluators making 3,952 judgments in France & Spain (Fracking ventures)
- **Method:** Full-profile Conjoint Experiment (Randomized regulatory, economic, normative & longevity cues)
- **Verdict:** ✅ CONFIRMED — Incongruent cue bundles produce intermediate "grey area" judgments; evaluators discount cues conflicting with their personal values
- **What it means for you:** Training must teach **cue coherence** across all 5 capabilities, not just throwing more signals at the wall

### EMR 2025: "Legitimation Strategies Can Backfire if Audience Disapproves"
- **Tested on:** French foie gras sector: interviews with producers + 3 associations, then 31 evaluators × 32 profiles (992 judgments)
- **Method:** Mixed Methods (Qualitative interviews to discover strategies + Conjoint experiment to test appropriateness)
- **Verdict:** ⚠️ CONFIRMED-NEGATIVE — Industry-favored legitimation strategies backfired when evaluators deemed the strategy itself improper
- **What it means for you:** You cannot assume training automatically helps; inappropriate founder signaling can actively damage venture standing

### AOM 2020: "Failed Women & Immigrant Founders Face a Legitimacy Penalty"
- **Tested on:** 74 evaluators evaluating 2,368 post-failure entrepreneurial profiles
- **Method:** Conjoint Experiment (Manipulating gender, immigrant origin, education & failure severity)
- **Verdict:** ✅ CONFIRMED — Minorities face harsher failure penalties; formal credentials (education) compensate less for minority founders
- **What it means for you:** Empirical rationale for subgroup analyses in ATENA — testing whether training offsets structural identity penalties

### JBE 2026: "Ethnic Bias Sits in the Evaluation System, Not Just Prejudiced Individuals"
- **Tested on:** 781 US evaluators making 12,496 funding-worthiness judgments of post-failure entrepreneurs
- **Method:** Large-scale Full-profile Conjoint Experiment (Randomized Latinx vs White surnames, debt levels & track records)

- **What it means for you:** Proves your unconventional target group faces systemic baseline deficits, justifying tailored support interventions

### JMS 2023: "Legitimacy is Not Binary — It Spans 5 Distinct Qualitative States"
- **Tested on:** Pure Theoretical Synthesis (Synthesizes Suchman, Bitektine, Tost, Vaara)
- **Method:** Conceptual Framework & Deductive Typology

- **What it means for you:** Novice founders begin in **Unknown (Undecided)** legitimacy; training is a structured mechanism for state transition

## ALDEBERT & ECOSYSTEM (Support Structures & Legitimacy Transfer)

### AEI 2021/2023: "An Accelerator Must Build Its Own Legitimacy Before It Can Transfer It"
- **Tested on:** 1 regional accelerator in South of France (Fieldwork 2020–2022)
- **Method:** Longitudinal Qualitative Single Case Study (Interviews, archival records, participant observation)
- **Verdict:** ✅ CONFIRMED-CONDITIONAL — Support structures transfer legitimacy in sequential phases, but repeated mobilization mechanisms experience decay
- **What it means for you:** atEnA is an accelerator/support structure; experimental baseline holds program-level legitimacy constant to isolate the module effect

### E&I 2024: "Large Corporations Are the Missing Bridge for Deeptech Legitimacy"
- **Tested on:** 2 French University Incubators and affiliated deeptech startup spin-offs
- **Method:** Multi-case Qualitative Study (Semi-structured interviews with incubator managers & founders)
- **Verdict:** ✅ CONFIRMED — Incubators supply capital but lack external market legitimacy; partnerships with corporate players bridge the gap
- **What it means for you:** atEnA's institutional partners (CCI, universities) provide the overarching structural umbrella

### E&RD 2024: "The Mental Model of a 'Legitimate Entrepreneur' Changes by Context"
- **Tested on:** 150 French entrepreneurs (Comparing domestic vs international operators)
- **Method:** Social Representations Survey (Structural cognitive mapping: central core vs peripheral elements)
- **Verdict:** ✅ CONFIRMED — Domestic and international founders internalize structurally different mental definitions of legitimacy
- **What it means for you:** Franco-Italian cross-border context contains distinct reference frameworks; site must be modeled as a moderator

### BJM 2026: "Legitimacy Can Be Scored Directly from Venture Texts and Predicts Failure"
- **Tested on:** Large corporate communications corpus paired with venture survival data (Ghods, Ricard, Aldebert & Schoon)
- **Method:** Computational Text Analysis on Object–Audience Dyads (Validated against expert human ratings + failure predictions)
- **Verdict:** ✅ CONFIRMED — Text-derived multi-dimensional legitimacy metrics successfully predict venture survival/failure
- **What it means for you:** Provides a methodological escape hatch to address common-method variance (coding participant pitch decks directly)

### HAL 2025: "Feeling Illegitimate Triggers Impostor Syndrome and Paralyzes Founders"
- **Tested on:** 122 Aix-Marseille University economics & management students and nascent entrepreneurs
- **Method:** Quantitative Cross-sectional Survey (Bertrand, Benamara & Aldebert)
- **Verdict:** ⚠️ CONFIRMED (Exploratory / Cross-sectional) — Internalized illegitimacy feeds impostor syndrome, directly suppressing entrepreneurial action
- **What it means for you:** Empirical precedent for using Daisy Bertrand's self-legitimacy scale as your primary psychological mediator

## SCHOON & GHODS (Operationalization & The Dyad)

### Schoon 2022 (ASR): "Legitimacy Lives Only in the Dyad: Object + Audience + Relation"
- **Tested on:** Conceptual synthesis of 50+ years of sociology, political science, and management literature
- **Method:** Theoretical & Relational Synthesis (~140 citations)
- **Verdict:** 💡 PROPOSED — Legitimacy requires 3 simultaneous conditions: Expectations + Assent + Conformity; without the dyad, it is merely prestige
- **What it means for you:** Your survey captures the founder's perceived half of the dyad; acknowledging this boundary disarms committee critique

### Ghods 2021 (PhD Thesis): "Operationalize → Measure → Test Moderation Arc"
- **Tested on:** 67 Biotech SMEs scored; 412 longitudinal observations on internationalization performance (Directed by Aldebert & Ricard; Jury: Alex Bitektine)
- **Method:** Multi-essay Mixed Methods: Social representations + Scale construction + Econometric panel moderation
- **Verdict:** ✅ CONFIRMED — Higher entrepreneurial legitimacy positively moderates the internationalization-performance relationship
- **What it means for you:** Ghods provides the empirical template for measurement; your thesis injects the **RCT training intervention** into that arc

## THE CORE GAP & JUNCTION
- **Siraz & co-authors:** Proved how evaluators process cues in their heads
- **Aldebert & co-authors:** Proved how ecosystems and structures transfer legitimacy
- **Schoon & Ghods:** Proved how to operationalize and measure the relational dyad
- **YOUR ATENA THESIS:** The unstudied question — **Can training the founder change the legitimacy verdict conferred by the evaluator?**`,

states: `# THE 5 LEGITIMACY STATES — JMS 2023 Deep-Dive
*Siraz, Claes, De Castro & Vaara (2023), Journal of Management Studies*

## 1. LEGITIMACY (Full Acceptance)
- **Definition:** Favorable judgments; venture is taken-for-granted, desirable, proper, and appropriate within prevailing NVBs
- **Congruence:** Strong alignment with prevailing norms, values, and beliefs
- **Opposition:** Passive / Dormant — unable to mobilize institutional validation
- **Evaluation Mode:** Passive cognitive processing (taken for granted)
- **Prescribed Strategies:** Framing (maintain buffer), Mythopoesis, Normalization, Historical Theorization
- **Cautionary Rule:** Overt defense of a taken-for-granted venture can backfire by drawing unnecessary scrutiny

## 2. CONDITIONAL LEGITIMACY ("Legitimate IF...")
- **Definition:** Evaluators accept the venture in principle, but impose explicit, binding constraints
- **Congruence:** Conditional upon compliance with specific boundaries (e.g., GMOs permitted only with labeling)
- **Opposition:** Active — capable of mounting validated counterarguments if conditions are breached
- **Evaluation Mode:** Active cognitive scrutiny; tensions exist between regulatory, pragmatic, and moral legitimacy
- **Prescribed Strategies:** Authorization, Rationalization (redefining means-ends), Self-Regulation, Commitment Narratives

## 3. UNKNOWN LEGITIMACY (The Novice Founder's State)
*Evaluators lack the basis to form a stable legitimacy verdict — 3 distinct sub-types:*
### A. Undetermined
- Evaluators are disengaged or uninterested; no evaluation has been initiated
- **Strategy:** Emotional framing, high-visibility storytelling, building baseline salience
### B. Undecided (Where ATENA Founders Start)
- Evaluators cannot judge due to missing information, information overload, or ambiguous signals
- **Strategy:** Analogical reasoning (frame unknown as familiar), role models, authorized intermediaries
- **Direct Connection:** ATENA training acts as the analogical framing mechanism + program endorsement
### C. Polarized
- Deeply divided evaluator base; two opposing sub-collectives co-exist in balance ("weak validity")
- **Strategy:** Bridging narratives, dual-framing tailored to distinct audience segments

## 4. CONDITIONAL ILLEGITIMACY ("Illegitimate BUT Tolerated")
- **Definition:** Venture is judged improper in principle, but granted an exception due to mitigating conditions
- **Congruence:** Fundamentally incongruent, but saved by pragmatic necessity or regulatory carve-outs (e.g., Medical Cannabis)
- **Opposition:** Active against granting the exception
- **Evaluation Mode:** Active; persistent tension between moral rejection and pragmatic acceptance
- **Prescribed Strategies:** Authorized Exception (appealing to formal dispensations), Higher-Good Moralization

## 5. ILLEGITIMACY (Active Rejection)
- **Definition:** Unfavorable judgments; venture is actively rejected, sanctioned, or stigmatized
- **Congruence:** Severe incongruence with prevailing societal norms, values, and beliefs
- **Opposition:** Institutionalized and active; negative judgments possess high cognitive stickiness
- **Evaluation Mode:** Passive or ritualized rejection
- **Prescribed Strategies:** Impression management, Decoupling, Normalization accounts, Relocating to favorable jurisdictions

## DYNAMIC SHIFTS (Figure 2 in Paper)
- **Trigger:** Venture enters a new environment or market
- **Determinants:** Stability of Reference Framework × Presence of Type Conflicts × Strength of Societal NVBs
- **Key Insight:** A venture's legitimacy state can flip from legitimate to contested without any change in its own behavior, solely because the societal yardstick shifted`,

thesis: `# THESIS ARGUMENT MAP — Paper-to-Chapter Guide

## 1. INTRODUCTION & MOTIVATION
- **Core Argument:** Unconventional and novice founders face a structural, non-meritocratic legitimacy deficit that paralyzes action
- **Papers to Cite:**
  - Siraz et al. (JBE 2026): Proves ethnicity penalty persists holding debt and financials constant
  - Siraz et al. (AOM 2020): Shows credentials compensate less for minority/immigrant founders
  - Bertrand, Benamara & Aldebert (2025): Proves feeling illegitimate suppresses entrepreneurial intention
- **Key Phrasing:** *"The legitimacy hurdle is documented to be structural rather than merit-based..."*

## 2. THEORETICAL FRAMEWORK
- **Core Argument:** Legitimacy is a multi-state relational judgment; training represents a transition from Unknown/Undecided to Conditional/Full Legitimacy
- **Papers to Cite:**
  - Siraz et al. (JMS 2023): 5-state framework (Cite as theoretical/proposed)
  - Schoon (ASR 2022): Relational dyad requiring expectations, assent, and conformity
  - Suchman (AMR 1995): Foundational pragmatic, moral, and cognitive dimensions
- **Key Phrasing:** *"We conceptualize novice ventures as occupying unknown legitimacy, specifically the undecided sub-state..."*

## 3. MECHANISMS & HYPOTHESES
- **Core Argument:** Evaluators judge via cues where categorical fit dominates; training improves cue emission and bundle coherence
- **Papers to Cite:**
  - Thaler, Siraz et al. (JMS Online First): Categorical fit is the #1 predictor of propriety
  - Siraz et al. (EMR 2026): Incongruent cue bundles stall evaluators in intermediate states
  - Aldebert (AEI 2021/2023): Support structures transfer legitimacy sequentially
- **Key Phrasing:** *"Training targets categorical fit while ensuring cue coherence across capability dimensions..."*

## 4. COUNTER-ARGUMENTS & BOUNDARY CONDITIONS
- **Core Argument:** Legitimation attempts are themselves evaluated; inappropriate strategies backfire, and structural bias may cap training effects
- **Papers to Cite:**
  - Claes, Siraz et al. (EMR 2025): Legitimation strategies backfire when perceived as improper
  - Siraz et al. (JBE 2026 / AOM 2020): Bias embedded in reference frameworks creates potential ceiling effects
- **Key Phrasing:** *"A null or heterogeneous treatment effect is theoretically informative rather than an empirical failure..."*

## 5. METHODOLOGY & MEASUREMENT DEFENSE
- **Core Argument:** Perceptual scales capture the founder node of the dyad; text analysis and conjoint designs represent natural validation extensions
- **Papers to Cite:**
  - Schoon (ASR 2022): The relational dyad as the proper unit of analysis
  - Ghods, Ricard, Aldebert & Schoon (BJM 2026): Computational text scoring of venture communications
  - Ghods, Ricard & Aldebert (E&RD 2024): Contextual variation in legitimacy representations
- **Key Phrasing:** *"Our instrument captures the founder-side node of Schoon's relational dyad..."*

## 6. THE CORE GAP & CONTRIBUTION
- **Core Argument:** The literature has tested evaluator cognition (Siraz) and ecosystem transfer (Aldebert), but has never tested whether the founder can be trained via an RCT
- **Papers to Cite:** The complete network synthesis + Ghods (2021 PhD template)
- **Key Phrasing:** *"What remains untested is whether training the founder crosses the boundary into the evaluator's judgment..."*`,

qa: `# COMMITTEE DEFENSE Q&A — Questions & Empirical Answers

## Q1: "Isn't your gap just a gap in the literature ('nobody has done an RCT')?"
- **Model Answer:** No. It is a fundamental theoretical tension. Legitimacy is defined as an evaluation in the stakeholder's mind, whereas entrepreneurship training operates strictly inside the founder. Theory cannot predict whether changing the founder's knowledge and signals will alter an external evaluator's proprietary judgment.
- **Backing Literature:** Suchman (1995); Schoon (2022); Siraz et al. (2023).

## Q2: "Why do you assume your novice founders start in 'Unknown' legitimacy?"
- **Model Answer:** Following Siraz et al. (2023), unknown legitimacy includes the *undecided* sub-state, where evaluators lack sufficient information to judge. Novice, unconventional founders have no track record or established category standing. However, we do not assume this as proven fact—we treat it as a theoretical expectation and empirically characterize baseline distributions.
- **Backing Literature:** Siraz et al. (2023) Table I; Thaler et al. (JMS Online First).

## Q3: "Is atEnA itself legitimate enough to transfer legitimacy to participants?"
- **Model Answer:** Aldebert's (2021) research shows support structures must build their own legitimacy before they can confer it. In our experimental design, atEnA's program-level legitimacy and institutional partnerships (CCIs, universities) are held constant between treatment and control, allowing us to isolate the specific incremental effect of the 12h training module.
- **Backing Literature:** Aldebert (AEI 2021, 2023); Aldebert (E&I 2024).

## Q4: "Your primary dependent variable is self-reported. Isn't that circular?"
- **Model Answer:** We explicitly acknowledge that our survey instrument measures the founder-side node of Schoon's (2022) relational dyad. To guard against common-method variance, we incorporate stakeholder validation milestones, and our design opens two direct extensions: applying Ghods et al.'s (2026) text-analysis scoring to pitch decks, and conducting a Siraz-style evaluator conjoint experiment.
- **Backing Literature:** Schoon (ASR 2022); Ghods et al. (BJM 2026); Bertrand et al. (2025).

## Q5: "How do you know your 5 capability categories are the right ones?"
- **Model Answer:** We do not assume they are universally effective. Claes, Siraz et al. (2025) demonstrate that legitimation strategies can be perceived as inappropriate and backfire. Our experiment specifically tests whether training these 5 capabilities produces positive, null, or negative shifts in perceived legitimacy.
- **Backing Literature:** Claes, Siraz et al. (EMR 2025); Siraz et al. (EMR 2026).

## Q6: "Won't structural bias prevent training from making any real difference?"
- **Model Answer:** Siraz et al. (2020, 2026) show that minority founders face persistent baseline penalties. This is why our empirical plan includes subgroup moderation analyses: to discover whether training helps most where baseline deficits are largest, or whether evaluator bias creates a hard ceiling.
- **Backing Literature:** Siraz et al. (AOM 2020); Siraz, Claes & Alvarez (JBE 2026).`,

methods: `# METHOD TOOLBOX — Methodological Guide to Legitimacy Research

## 1. CONJOINT / FACTORIAL EXPERIMENT (The Evaluator Standard)
- **How Data is Collected:** Randomized orthogonal profiles (e.g., 32 profiles per judge) rated on Likert scales
- **Analytical Method:** Multilevel regression (ratings nested in judges) with interaction terms for evaluator values
- **Sample Sizes in Field:** Siraz studies range from 992 to 12,496 evaluations across 31 to 781 evaluators
- **Core Strength:** Unambiguous causal identification of which cues drive evaluator propriety
- **Core Limitation:** Relies on hypothetical vignette decisions rather than real-world resource allocation
- **Use in Your Thesis:** The planned Article 4 extension (pitch profiles evaluated by real bankers/jurors)

## 2. QUALITATIVE CASE STUDY (Mechanism Discovery)
- **How Data is Collected:** Semi-structured interviews with founders/managers, archival records, multi-year fieldwork
- **Analytical Method:** Thematic coding, process tracing, inductive/abductive mechanism modeling
- **Studies in Field:** Aldebert AEI (accelerators), Aldebert E&I (deeptech), Siraz JMI (Colombian CBEs)
- **Core Strength:** Unpacks temporal sequences, institutional barriers, and "how/why" mechanisms
- **Core Limitation:** Cannot quantify effect sizes or establish statistical generalizability
- **Use in Your Thesis:** Article 2 comparative qualitative analysis of high vs low treatment responders

## 3. QUANTITATIVE SURVEY (Self-Reported Perceptions)
- **How Data is Collected:** Psychometrically validated scales administered at fixed time intervals
- **Analytical Method:** Confirmatory Factor Analysis (CFA), Structural Equation Modeling (SEM), Cluster Analysis
- **Studies in Field:** Bertrand, Benamara & Aldebert 2025 (n=122 students); Ghods et al. 2024 (n=150)
