methods: `# METHOD TOOLBOX — Systematic Operational Breakdown
*Standardized 5-line structure: 1. Who Evaluates & What They Do → 2. How They Do It (Data Collection & Analysis) → 3. Key Methodological Problems Faced → 4. How They Solve These Problems → 5. Application in Your Thesis*

## PART A — YOUR ATENA METHODS (The 3 Designs You Actually Run)
*Your thesis combines: an experiment (Article 1), interviews (Article 2), and longitudinal tracking (the measurement spine)*

### A1. FIELD EXPERIMENT / RCT — Article 1 (Your Causal Engine)
- **1. Who Evaluates & What They Do:** Nascent entrepreneurs in the atEnA program are randomized into Treatment (12h legitimacy module) vs Control (standard program). The ultimate judges are real market stakeholders; you measure the founder-side node plus objective milestones.
- **2. How They Do It:** Random assignment at enrollment → T0 baseline survey → 12-hour module across the 5 capability dimensions → T1 post-test → T4 follow-up. Analysis: Intention-to-Treat + ANCOVA/difference-in-differences comparing treatment vs control on self-legitimacy and perceived legitimacy scales.
- **3. Problems They Face:** (a) Attrition between survey waves; (b) Contamination — treated founders sharing module content with control peers; (c) Self-report bias on legitimacy scales; (d) Limited sample power in a field setting.
- **4. How They Solve These Problems:** (a) ITT estimation + attrition analysis comparing leavers vs stayers; (b) Cohort separation / staggered rollout so treatment and control don't mix; (c) Triangulating self-reports with objective milestones (registrations, applications, revenue); (d) Pre-registered hypotheses and analysis plan.
- **5. Application in Your Thesis:** Article 1 — the core causal test that legitimacy can be trained, the design the literature has never run.

### A2. SEMI-STRUCTURED INTERVIEWS — Article 2 (Your Mechanism Tracer)
- **1. Who Evaluates & What They Do:** You (the researcher) interview founders from both treatment and control arms — purposively selecting high-responders vs low-responders to the training. ~30–60 min per interview.
- **2. How They Do It:** Interview guide built on the 5 capability dimensions (positioning, value demonstration, networks, milestones, compliance). Recorded, transcribed, thematically coded (Gioia-style: first-order codes → second-order themes → aggregate dimensions). Literature anchor: Aldebert (2021/2023) ran 34 interviews across 24 months in the same regional ecosystem.
- **3. Problems They Face:** (a) Recall bias — founders reconstruct their story after the fact; (b) Social desirability — telling you the training "worked"; (c) Small n — cannot generalize statistically; (d) Researcher subjectivity in coding.
- **4. How They Solve These Problems:** (a) Ask for concrete episodes, not opinions ("walk me through your last pitch"); (b) Anonymized transcripts + neutral framing; (c) Extreme-case sampling — comparing high vs low responders IS the design; (d) Dual-coding a subset with Cohen's kappa + triangulating statements against survey scores and pitch texts.
- **5. Application in Your Thesis:** Article 2 — explains HOW and WHY the treatment works (or fails) inside the founder, complementing Article 1's causal estimate with the mechanism.

### A3. LONGITUDINAL MULTI-WAVE SURVEY — T0 → T1 → T4 (Your Measurement Spine)
- **1. Who Evaluates & What They Do:** The founders themselves — reporting self-legitimacy and perceived external standing at three or more points in time.
- **2. How They Do It:** Same validated scales at every wave (Bertrand self-legitimacy scale + perceived legitimacy scale) administered T0 (pre), T1 (post-module), T4 (months later — decay test). Analysis: repeated-measures multilevel model (waves nested in persons); the treatment × time interaction IS the training effect. Same panel logic Ghods used (412 firm-year observations) — yours is at the founder level.
- **3. Problems They Face:** (a) Panel attrition — founders drop out between waves; (b) Panel conditioning — answering differently because they've seen the survey before; (c) Common-method variance — same person, same instrument, same sitting; (d) Maturation — founders change over time regardless of treatment.
- **4. How They Solve These Problems:** (a) Randomized control measured at every wave absorbs maturation + conditioning effects; (b) ITT + multiple imputation for missing waves; (c) Temporal separation of predictor and outcome items + anonymized administration; (d) Anchoring survey change against behavioral milestones.
- **5. Application in Your Thesis:** The measurement backbone of Article 1 — and your defense against "one-shot survey" critiques.

## PART B — METHODS FROM THE LITERATURE (What Others Use)

## B1. CONJOINT / FACTORIAL EXPERIMENT (The Evaluator Cognition Standard)
- **1. Who Evaluates & What They Do:** Human judges (bankers, consumers, investors, or general citizens; e.g. Siraz's 31 to 781 evaluators) act as the evaluators. They read hypothetical venture descriptions and assign legitimacy or funding scores.
- **2. How They Do It:** Software generates randomized profiles mixing different cues (e.g., male vs female founder, certified vs non-certified). Each judge rates 16 to 32 profiles. Multilevel regression models the data because multiple ratings (Level 1) are nested inside individual judges (Level 2).
- **3. Problems They Face:** (a) Rating fatigue (evaluators getting tired after rating 30 profiles); (b) Non-independence of observations (one judge gives consistently high or low ratings across all profiles); (c) Hypothetical bias (judging on paper is not real investing).
- **4. How They Solve These Problems:** (a) Orthogonal fractional factorial designs keep profile counts manageable (16–32); (b) Random-effects hierarchical modeling clusters standard errors by judge; (c) High-realism vignettes mimic authentic pitch summaries.
- **5. Application in Your Thesis:** The planned Article 4 extension — presenting randomized atEnA founder pitch profiles to real regional bank officers and grant committees.

## B2. COMPUTATIONAL TEXT ANALYSIS (Objective Dyadic Measurement)
- **1. Who Evaluates & What They Do:** NLP algorithms act as automated evaluators. They analyze written artifacts (venture websites, pitch decks, press releases) paired with specific target audiences (customers, regulators, investors).
- **2. How They Do It:** Algorithms parse textual documents into multi-dimensional legitimacy dictionaries (pragmatic, moral, cognitive, regulatory words). Each firm receives an objective composite legitimacy score and per-dimension metrics.
- **3. Problems They Face:** (a) Contextual nuance / sarcasm (algorithms misinterpreting complex language); (b) Single-audience bias; (c) Proving that textual scores reflect real-world survival.
- **4. How They Solve These Problems:** (a) Multi-stage human expert validation calibrates dictionary weights; (b) Modeling dyadic interaction (scoring text relative to audience type); (c) Econometric validation proving scores predict out-of-sample venture failure.
- **5. Application in Your Thesis:** Behavioral validation check — scoring participants' written pitch deck submissions to eliminate common-method variance (CMV) critiques.

## B3. QUALITATIVE CASE STUDY (Mechanism & Process Discovery)
- **1. Who Evaluates & What They Do:** The academic researcher acts as the investigator. They evaluate incubator managers, mentors, and entrepreneurs across longitudinal timeframes.
- **2. How They Do It:** Conducting 60–90 minute semi-structured interviews, attending internal committee meetings, reviewing pitch logs, and analyzing internal documents. Data is coded thematically using Gioia / process-tracing methodology.
- **3. Problems They Face:** (a) Retrospective recall bias (founders misremembering early events); (b) Researcher subjectivity; (c) Lack of statistical generalizability.
- **4. How They Solve These Problems:** (a) Triangulating interviews with real-time archival records and meeting minutes; (b) Dual-coder inter-rater reliability checks; (c) Multi-case comparative designs (comparing successful vs stalled support structures).
- **5. Application in Your Thesis:** Article 2 qualitative comparative study — interviewing high-responding vs low-responding entrepreneurs to trace the internal learning and signaling process.

## B4. QUANTITATIVE SURVEY (Self-Reported Perceptions)
- **1. Who Evaluates & What They Do:** Active founders evaluate themselves and their perceived standing in the market using psychometrically validated multi-item Likert scales.
- **2. How They Do It:** Distributing structured digital questionnaires. Analyzed using Exploratory / Confirmatory Factor Analysis (CFA), Structural Equation Modeling (SEM), and cluster analysis.
- **3. Problems They Face:** (a) Common-Method Variance (CMV) when independent and dependent variables are collected on the same survey; (b) Social desirability bias (founders overstating confidence); (c) Lack of causal directionality.
- **4. How They Solve These Problems:** (a) Methodological separation: temporal spacing between waves (T0, T1, T4) and negative control items; (b) Anonymized survey administration; (c) Anchoring within an RCT framework to establish true causal direction.
- **5. Application in Your Thesis:** Core measurement instrument for founder self-legitimacy (Bertrand scale) and perceived external legitimacy (Alexiou & Wiggins scale).

## B5. SOCIAL REPRESENTATIONS SURVEY (Cognitive Mapping)
- **1. Who Evaluates & What They Do:** Cohorts of practicing entrepreneurs evaluate the abstract concept of "the legitimate entrepreneur" by producing spontaneous word associations.
- **2. How They Do It:** Respondents write the first 5 words that come to mind when prompted with "legitimate entrepreneur," then rank their importance (1 to 5). Analyzed using Vergès structural matrix (associative frequency × average rank) to isolate central core vs peripheral beliefs.
- **3. Problems They Face:** (a) Lexical ambiguity (synonyms and varied phrasing across respondents); (b) Small sample sensitivity; (c) Cultural/linguistic differences across languages.
- **4. How They Solve These Problems:** (a) Standardized lemmatization and semantic grouping dictionaries; (b) Bootstrapped rank-order significance testing; (c) Comparative multi-group analysis (domestic vs international operators).
- **5. Application in Your Thesis:** Methodological rationale for treating the cross-border Franco-Italian regional context as containing distinct institutional reference frameworks.`,

*Uniform 4-line structure: 1. Research Question → 2. Core Finding / Verdict → 3. Methodology & Epistemic Base → 4. How You Use It in Thesis*

## 0. THE DYAD SPINE — Schoon's Framework Sits ONE LEVEL ABOVE Everyone
*Schoon's 3 dyad variables organize the entire field: every scholar studies ONE side of the relationship*
- **EXPECTATIONS (judge side — the yardstick, upstream):** What evaluators believe a proper venture should look like
  - → Suchman 1995 (the norms/values basis of the yardstick)

- **CONFORMITY (founder side — the signals = YOUR 5 CAPABILITIES):** What the venture emits to match the yardstick
  - → Cognitive (positioning & category framing) · Pragmatic (value demonstration) · Social (networks & vouching) · Factual (milestones & credentials) · Regulative (compliance beyond minimums)
  - → Suddaby & Vaara (legitimation strategies founders deploy)
  - → Fisher 2020 (new venture signaling repertoire)
  - → Aldebert (accelerators teach/boost conformity signals)
- **ASSENT (judge side — the verdict, downstream):** The evaluator's approval judgment itself
  - → Tost 2011 (propriety = individual assent; validity = collective assent)
  - → Bitektine & Haack 2015 (how individual assent scales to institutional validity)
  - → Siraz JMS online first / JBE 2026 / AOM 2020 / EMR 2025 (propriety measured via conjoint)
  - → Bertrand HAL 2025 (self-assent = the founder's internal mirror of the dyad)
- **THE CHAIN:** EXPECTATIONS set by context → CONFORMITY trained by ATENA → ASSENT measured by Siraz → legitimacy conferred

## 1. THE FOUNDATIONAL CANON (Defines the EXPECTATIONS side — what makes a "proper" venture)

### Mark Suchman (1995 AMR): "Managing Legitimacy: Strategic and Institutional Approaches"
- **1. Question:** What is organizational legitimacy, and what distinct forms does it take when managed strategically?
- **2. Finding / Verdict:** 💡 THEORETICAL FOUNDATION (~22,000 citations) — Defined legitimacy as a generalized perception of appropriateness; established the Pragmatic, Moral, and Cognitive tripartite typology
- **3. Methodology:** Deductive conceptual synthesis bridging organizational institutionalism and strategic management
- **4. How you use it:** Foundational definition for Slide 3; directly maps onto the 5 capabilities in your 12h training module

### Michael Tost (2011 AMR): "An Integrative Model of Legitimacy Judgments"
- **1. Question:** How do individuals actually form legitimacy judgments, and how does micro-judgment relate to macro-validity?
- **2. Finding / Verdict:** 💡 THEORETICAL MECHANISM — Formulated the critical distinction between **Propriety** (individual evaluator belief) and **Validity** (collective social fact)
- **3. Methodology:** Dual-process cognitive psychology synthesis (System 1 automatic vs System 2 deliberative evaluation)
- **4. How you use it:** Provides the precise conceptual mechanism explaining how individual evaluator judgments aggregate into collective venture standing

### Alex Bitektine & Patrick Haack (2015 AMJ): "The 'Macro' and the 'Micro' of Legitimacy"
- **1. Question:** Through what multi-level process do individual propriety judgments scale up into institutionalized validity?
- **2. Finding / Verdict:** 💡 MULTILEVEL MODEL — Demonstrated that macro-validity acts as a cognitive heuristic that suppresses active judgment, while institutional disruption re-activates active propriety evaluation
- **3. Methodology:** Multilevel conceptual integration linking micro-evaluator cognitive processing to macro-institutionalization
- **4. How you use it:** Theoretical basis for showing why novice founders without validity cues must undergo active, high-scrutiny evaluator judgments

### Roy Suddaby & Eero Vaara: "Discursive & Rhetorical Legitimation Strategies"
- **1. Question:** What linguistic, rhetorical, and narrative strategies do actors employ to construct, maintain, or repair legitimacy?
- **2. Finding / Verdict:** ✅ THEORETICAL & EMPIRICAL FOUNDATION — Identified Authorization, Rationalization, Moralization, and Mythopoesis as core discursive legitimation repertories
- **3. Methodology:** Critical discourse analysis and rhetorical analysis of institutional transformation across diverse corporate fields
- **4. How you use it:** Informs the communication and storytelling capability taught in the 12h ATENA entrepreneurship module

## 2. THE EVALUATOR COGNITION STREAM — the ASSENT side (Sonia Siraz & Co-Authors study how judges form the verdict)

### Eero Vaara (Oxford University): Co-Author on JMS 2023
- **1. Question:** How do discursive legitimation strategies map onto the 5 distinct states in the grey zone?
- **2. Finding / Verdict:** 💡 PROPOSED TYPOLOGY — Co-authored the foundational 5-state framework, contributing the state-specific discursive strategy matrices (Tables II–VI)
- **3. Methodology:** Conceptual rhetorical synthesis
- **4. How you use it:** Citing Vaara connects your discursive training module directly to the Siraz 2023 theoretical engine

### Anne-Sophie Claes (Louvain / IE): Primary Empirical Co-Author
- **1. Question:** How do evaluators process cue bundles and legitimation strategies in contested industries (foie gras, fracking)?
- **2. Finding / Verdict:** ✅ CONFIRMED EMPIRICALLY — Proved that cue incongruence produces grey-area stall and improper legitimation strategies backfire
- **3. Methodology:** Conjoint and factorial experimental designs analyzing evaluator decisions
- **4. How you use it:** Direct evidence that training must ensure signal coherence to avoid backfire effects

## 3. THE ECOSYSTEM & MEASUREMENT STREAM — spans all 3 components (Bénédicte Aldebert & CERGAM/AMU: ecosystem boosts CONFORMITY signals; Ghods measures firm-side scores; Bertrand captures self-ASSENT)

### Daisy Bertrand (CERGAM / AMU): Self-Legitimacy Pioneer
- **1. Question:** How do nascent entrepreneurs perceive their own internal legitimacy, and how does illegitimacy block action?
- **2. Finding / Verdict:** ✅ CONFIRMED (Exploratory Scale Validation) — Validated the 4-dimensional **Self-Legitimacy Scale** linking low self-legitimacy to impostor syndrome
- **3. Methodology:** Psychometric scale validation, student entrepreneur surveys, and structural equation modeling
- **4. How you use it:** You use Bertrand's exact scale in your 44-item ATENA instrument as your central psychological mediator

### Antonin Ricard (IAE / AMU): Legitimacy Chair Co-Director
- **1. Question:** How does entrepreneurial legitimacy affect international new venture performance and social representations?
- **2. Finding / Verdict:** ✅ CONFIRMED — Co-directed Ghods' PhD; proved legitimacy moderates internationalization performance and varies across domestic vs foreign contexts
- **3. Methodology:** Quantitative cognitive representations and longitudinal panel econometrics
- **4. How you use it:** Rationale for testing cross-border regional context as a formal moderator in your Franco-Italian sample

### Ali Ghods (PhD 2021, AMU): The Cross-Border Legitimacy Pioneer
- **1. Question:** How does entrepreneurial legitimacy help startups when they expand into foreign (cross-border) markets?
- **2. Finding / Verdict:** ✅ CONFIRMED (p < 0.05) — Going international is risky; startups only convert cross-border expansion into high performance if they possess strong legitimacy

qa: `# COMMITTEE DEFENSE Q&A — 12 Critical Questions & Empirical Model Answers
*Structured for rapid 30-second mastery: Model Answer (Core Claim + Two-Link Logic) → Backing Literature*

## SECTION A: THEORETICAL PUZZLE & GAP

### Q1: "Isn't your gap merely an absence of literature ('nobody did an RCT')?"
- **Model Answer:** No. It is a fundamental theoretical tension. Legitimacy is defined as an evaluation that resides strictly in the external stakeholder's mind, whereas entrepreneurship training operates strictly inside the founder. Existing theory cannot predict whether altering a founder's internal knowledge and signals will successfully bridge the boundary and change an external evaluator's proprietary judgment.
- **Backing Literature:** Mark Suchman (1995 AMR); Eric Schoon (2022 ASR); Sonia Siraz et al. (2023 JMS).

### Q2: "Why do you assume your novice founders start in 'Unknown' legitimacy rather than Illegitimacy?"
- **Model Answer:** Following Siraz et al. (2023), unknown legitimacy includes the *undecided* sub-state, where evaluators lack sufficient information to judge. Novice, unconventional founders possess no negative track record or stigma—they simply suffer from a lack of visibility and recognizable category fit. We do not assume this as a proven fact; we treat it as a theoretical expectation and empirically characterize baseline distributions at T0.
- **Backing Literature:** Siraz, Claes, De Castro & Vaara (2023 JMS, Table I); Thaler, Sievert, Siraz et al. (JMS Online First).

### Q3: "What if your experiment finds a null result—does your whole thesis fail?"
- **Model Answer:** Absolutely not; a null result is theoretically profound. It identifies an empirical boundary condition for entrepreneurship policy: proving that founder-side capability training cannot cross the evaluator boundary. As Claes et al. (2025) and Siraz et al. (2026) show, evaluator bias and perceived strategy appropriateness can override founder behavior. If training fails to move external judgments, it proves public policy must shift from founder training to evaluator-facing certification platforms.
- **Backing Literature:** Claes, Siraz et al. (2025 EMR); Siraz, Claes & Alvarez (2026 JBE); Bitektine & Haack (2015 AMJ).

### Q4: "What are your 5 training dimensions, and what does the intervention train?"
- **Model Answer:** Our 12-hour intervention trains **5 distinct legitimacy dimensions** (as established in our training design):
  - **1. Cognitive:** Clear positioning and category framing of the venture
  - **2. Pragmatic:** Demonstrating concrete value creation and client utility
  - **3. Social:** Building networks, ties, and social ease/vouching
  - **4. Factual:** Documenting expertise, track records, and operational milestones
  - **5. Regulative:** Regulatory compliance that goes beyond baseline legal minimums
  - *Theoretical Link:* These 5 trained dimensions operationalize Suchman's (1995) classical macro-dimensions by equipping founders with the specific behavioral signaling repertoires needed to generate external validity cues.
- **Backing Literature:** Mark Suchman (1995 AMR); Zimmerman & Zeitz (2002 AMR); Greg Fisher (2020 Org Theory); Alex Bitektine (2011 AMR).

## SECTION B: MEASUREMENT & OPERATIONALIZATION

### Q5: "Your dependent variable relies on founder self-report. Isn't that circular?"
- **Model Answer:** We explicitly acknowledge that our survey captures the founder-side node of Schoon's (2022) relational dyad. To ensure methodological rigor, we include objective stakeholder validation milestones, and our design incorporates two direct validation extensions: applying Ghods et al.'s (2026) computational text-analysis scoring to participants' written pitch decks, and executing a Siraz-style evaluator conjoint experiment in Article 4.
- **Backing Literature:** Eric Schoon (2022 ASR); Ghods, Ricard, Aldebert & Schoon (2026 BJM); Daisy Bertrand et al. (2025 HAL).

### Q6: "Why use Bertrand's Self-Legitimacy scale instead of standard General Self-Efficacy?"
- **Model Answer:** General self-efficacy measures a generalized belief in one's capability to execute tasks. In contrast, Bertrand's self-legitimacy instrument measures the entrepreneur's internalized feeling of social rightness, appropriateness, and entitlement to operate as a venture founder. As Bertrand, Benamara & Aldebert (2025) prove, self-illegitimacy specifically triggers impostor syndrome and suppresses action, making it the precise psychological mediator for our causal chain.
- **Backing Literature:** Daisy Bertrand, Benamara & Aldebert (2025 HAL); Alex Bitektine (2011 AMR); Michael Tost (2011 AMR).

### Q7: "How do you defend your construct validity against Common-Method Variance (CMV)?"
- **Model Answer:** We employ procedural and statistical remedies: (1) Temporal separation between Baseline (T0), Post-treatment (T1), and Follow-up (T4); (2) Separating self-legitimacy items from external stakeholder validation scales; and (3) Triangulating self-reports against objective textual artifacts scored via Ghods et al.'s (2026) multi-dimensional NLP method.
- **Backing Literature:** Podsakoff et al. (2003 JAP); Ghods, Ricard, Aldebert & Schoon (2026 BJM).

## SECTION C: ECOSYSTEM, MECHANISMS & BIAS

### Q8: "Is atEnA itself legitimate enough to confer legitimacy to its participants?"
- **Model Answer:** Aldebert's (2021, 2023) research demonstrates that support structures must establish their own institutional legitimacy before they can confer it. In our field RCT, atEnA's program-level standing and institutional backing (CCIs, regional universities) are held strictly constant between treatment and control cohorts, allowing us to isolate the specific incremental value-add of the 12h educational curriculum.
- **Backing Literature:** Bénédicte Aldebert (2021, 2023 AEI); Aldebert (2024 E&I).

### Q9: "How do you know your 5 capability categories won't backfire?"
- **Model Answer:** We do not assume they will succeed ex-ante. Claes, Siraz et al. (2025) empirically demonstrated that legitimation strategies favored by an industry can be perceived as inappropriate by evaluators and actively backfire. That is precisely why our study is designed as an empirical field experiment: to test whether training these capabilities produces positive, neutral, or negative effects on evaluator judgments.
- **Backing Literature:** Claes, Siraz, De Castro & Lapeyre (2025 EMR); Siraz, Claes & De Castro (2026 EMR).

### Q10: "Won't structural bias (gender, ethnicity) override any training effect?"
- **Model Answer:** Siraz et al. (2020, 2026) demonstrate that women, immigrants, and ethnic minorities face persistent baseline legitimacy penalties. This is why our empirical analysis plan incorporates formal subgroup moderation: to test whether capability training can partially compensate for structural identity deficits, or whether evaluator bias imposes an insurmountable ceiling.
- **Backing Literature:** Sonia Siraz et al. (2020 AOM); Siraz, Claes & Alvarez (2026 JBE).

### Q11: "How do you account for institutional differences between France and Italy?"
- **Model Answer:** Ghods, Ricard & Aldebert (2024) show that social representations of the 'legitimate entrepreneur' vary across operating environments. Because norms, values, and beliefs (NVBs) differ across the Franco-Italian border, we model geographic site as a formal multi-group moderator rather than pooling cross-border data into a single homogeneous bucket.
- **Backing Literature:** Ghods, Ricard & Aldebert (2024 E&RD); Siraz et al. (2023 JMS).

### Q12: "Why did you choose a 12-hour module instead of a multi-month incubator program?"
- **Model Answer:** A focused 12-hour intervention provides high experimental fidelity and clean causal identification. In long, multi-month incubation programs, treatments become confounded with peer effects, ad-hoc mentoring, and external market shocks. A 12-hour structured curriculum allows us to cleanly isolate the direct causal impact of codified legitimation training on entrepreneurial self-perception and signaling behavior.
- **Backing Literature:** McKenzie & Woodruff (2014 World Bank); Anderson et al. (2018 Management Science); Greg Fisher (2020 Org Theory).`,

cards: `# DETAILED RESEARCH CARDS
*7-line structured breakdown per study*

## 1. Siraz, Claes, De Castro & Vaara (2023) — JMS
- **Focus:** The Grey Area between Legitimacy and Illegitimacy

- **Design & Method:** Conceptual framework and deductive typology
- **Core Claim:** Legitimacy is not a binary scale; actors occupy 5 qualitatively distinct states
- **Verdict:** 💡 PROPOSED (Theoretical framework)
- **Empirical Finding:** Framework formalizes 5 states, state-specific discursive strategies, and dynamic transitions driven by reference framework shifts
- **Use in Thesis:** Theoretical foundation for arguing novice founders start in Unknown/Undecided state

## 2. Thaler, Sievert, Siraz, Claes & Pinz (Online First) — JMS
- **Focus:** Microlevel Judgments: Validity Cues and Categorical Fit
- **Sample / Context:** 1,866 evaluators in two factorial survey studies
- **Design & Method:** 2 Factorial Survey Experiments testing authorization, endorsement, and category cues
- **Core Claim:** Categorical fit and cue valence shape individual propriety beliefs
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Categorical fit is the dominant predictor; negative cues have stronger impact than positive cues
- **Use in Thesis:** Justifies cognitive-positioning as the primary capability in ATENA training

## 3. Siraz, Claes & De Castro (2026) — EMR
- **Focus:** Cue Congruence and Evaluator Values in Contested Fields
- **Sample / Context:** 247 evaluators making 3,952 evaluations (France & Spain fracking sector)
- **Design & Method:** Full-profile Conjoint Experiment with 4 cue types (regulatory, pragmatic, normative, cognitive)
- **Core Claim:** Cue congruence and cue-value congruence determine individual propriety
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Incongruent cues produce intermediate evaluations; personal environmentalism discounts pro-industry cues
- **Use in Thesis:** Motivates why training must deliver coherent, non-contradictory cue bundles

## 4. Claes, Siraz, De Castro & Lapeyre (2025) — EMR
- **Focus:** Legitimation Strategies & Audience Appropriateness in Foie Gras
- **Sample / Context:** French foie gras sector: producer interviews + 31 evaluators × 32 profiles (992 evaluations)
- **Design & Method:** Mixed Methods: Qualitative strategy extraction + Conjoint experiment
- **Core Claim:** Legitimation strategies must be perceived as appropriate to be effective
- **Verdict:** ⚠️ CONFIRMED-NEGATIVE (Strategies can backfire)
- **Empirical Finding:** Industry-favored legitimation strategies backfired when evaluators viewed the strategy itself as improper
- **Use in Thesis:** Explains why training effects must be empirically tested rather than assumed positive

## 5. Siraz, Claes et al. (2020) — AOM / BCERC
- **Focus:** Legitimacy Judgments of Entrepreneurial Failures
- **Sample / Context:** 74 evaluators reviewing 2,368 failed venture profiles
- **Design & Method:** Conjoint Experiment manipulating founder gender, immigrant status, education, and failure context
- **Core Claim:** Founder demographic characteristics bias post-failure legitimacy assessments
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Women and immigrant founders face harsher legitimacy penalties; education offsets less penalty for minorities
- **Use in Thesis:** Theoretical rationale for testing heterogeneous treatment effects across founder subgroups

## 6. Siraz, Claes & Alvarez (2026) — JBE
- **Focus:** Funding-Worthiness Assessments of Latinx vs White Entrepreneurs
- **Sample / Context:** 781 US evaluators making 12,496 funding decisions
- **Design & Method:** Large-scale Full-profile Conjoint Experiment
- **Core Claim:** Systemic ethnic bias influences resource allocation evaluations post-failure
- **Verdict:** ✅ CONFIRMED (Counterintuitive)
- **Empirical Finding:** Latinx founders rated less funding-worthy despite equal/lower debt; Latinx evaluators were not more lenient
- **Use in Thesis:** Demonstrates that unconventional founders face structural deficits embedded in evaluator reference frameworks

## 7. Aldebert (2021, 2023) — AEI
- **Focus:** Legitimacy Transfer Mechanics in Early-Stage Accelerators
- **Sample / Context:** 1 regional accelerator in South of France (2020–2022 fieldwork)
- **Design & Method:** Longitudinal Qualitative Case Study (Interviews, observation, documents)
- **Core Claim:** Support structures transfer legitimacy sequentially, but require internal legitimacy first
- **Verdict:** ✅ CONFIRMED-CONDITIONAL
- **Empirical Finding:** Legitimation mechanisms evolve across lifecycle phases; repetitive audience mobilization mechanisms experience exhaustion
- **Use in Thesis:** Establishes that atEnA's institutional standing is a necessary condition for legitimacy transfer

## 8. Aldebert (2024) — E&I
- **Focus:** Deeptech Legitimacy Transfer & The Corporate Missing Link
- **Sample / Context:** 2 French University Incubators and deeptech startup spin-offs

## 9. Ghods, Ricard & Aldebert (2024) — E&RD
- **Focus:** Social Representations of the "Legitimate Entrepreneur"
- **Sample / Context:** 150 French entrepreneurs (domestic vs international)
- **Design & Method:** Quantitative Social Representations Survey (Core-periphery analysis)
- **Core Claim:** Legitimacy definitions are collective images that vary across operating contexts
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Domestic and international entrepreneurs hold distinct, context-specific representations of legitimacy
- **Use in Thesis:** Rationale for modeling the Franco-Italian cross-border context as a moderator

## 10. Ghods, Ricard, Aldebert & Schoon (2026) — BJM
- **Focus:** Multi-Dimensional Textual Measurement of New Venture Legitimacy
- **Sample / Context:** Corporate communications corpus paired with venture survival tracking
- **Design & Method:** Computational Text Analysis on Object–Audience Dyads
- **Core Claim:** Legitimacy can be extracted from textual artifacts at scale and predicts firm outcomes
- **Verdict:** ✅ CONFIRMED
- **Empirical Finding:** Multi-dimensional textual metrics validated against expert evaluations and reliably predict venture failure

## 11. Bertrand, Benamara & Aldebert (2025) — HAL
- **Focus:** Illegitimacy Feelings, Impostor Syndrome & Entrepreneurial Intention
- **Sample / Context:** 122 AMU students and nascent student entrepreneurs
- **Design & Method:** Quantitative Survey & Cluster Analysis
- **Core Claim:** Internal feelings of illegitimacy inhibit entrepreneurial intentions via impostor syndrome

states: `# THE 5 LEGITIMACY STATES — JMS 2023 Deep-Dive
*Siraz, Claes, De Castro & Vaara (2023), Journal of Management Studies*

## 1. LEGITIMACY (Full Acceptance)
- **Definition:** Favorable judgments; venture is taken-for-granted, desirable, proper, and appropriate within prevailing NVBs
- **Congruence:** Strong alignment with prevailing norms, values, and beliefs
- **Opposition:** Passive / Dormant — unable to mobilize institutional validation
- **Evaluation Mode:** Passive cognitive processing (taken for granted)
- **Prescribed Strategies:** Framing (maintain buffer), Mythopoesis, Normalization, Historical Theorization
- **Cautionary Rule:** Overt defense of a taken-for-granted venture can backfire by drawing unnecessary scrutiny

## 2. CONDITIONAL LEGITIMACY ("Legitimate IF...")
- **Definition:** Evaluators accept the venture in principle, but impose explicit, binding constraints
- **Congruence:** Conditional upon compliance with specific boundaries (e.g., GMOs permitted only with labeling)
- **Opposition:** Active — capable of mounting validated counterarguments if conditions are breached
- **Evaluation Mode:** Active cognitive scrutiny; tensions exist between regulatory, pragmatic, and moral legitimacy
- **Prescribed Strategies:** Authorization, Rationalization (redefining means-ends), Self-Regulation, Commitment Narratives

## 3. UNKNOWN LEGITIMACY (The Novice Founder's State)
*Evaluators lack the basis to form a stable legitimacy verdict — 3 distinct sub-types:*
### A. Undetermined
- Evaluators are disengaged or uninterested; no evaluation has been initiated
- **Strategy:** Emotional framing, high-visibility storytelling, building baseline salience
### B. Undecided (Where ATENA Founders Start)
- Evaluators cannot judge due to missing information, information overload, or ambiguous signals
- **Strategy:** Analogical reasoning (frame unknown as familiar), role models, authorized intermediaries
- **Direct Connection:** ATENA training acts as the analogical framing mechanism + program endorsement
### C. Polarized
- Deeply divided evaluator base; two opposing sub-collectives co-exist in balance ("weak validity")
- **Strategy:** Bridging narratives, dual-framing tailored to distinct audience segments

## 4. CONDITIONAL ILLEGITIMACY ("Illegitimate BUT Tolerated")
- **Definition:** Venture is judged improper in principle, but granted an exception due to mitigating conditions
- **Congruence:** Fundamentally incongruent, but saved by pragmatic necessity or regulatory carve-outs (e.g., Medical Cannabis)
- **Opposition:** Active against granting the exception
- **Evaluation Mode:** Active; persistent tension between moral rejection and pragmatic acceptance
- **Prescribed Strategies:** Authorized Exception (appealing to formal dispensations), Higher-Good Moralization

## 5. ILLEGITIMACY (Active Rejection)
- **Definition:** Unfavorable judgments; venture is actively rejected, sanctioned, or stigmatized
- **Congruence:** Severe incongruence with prevailing societal norms, values, and beliefs
- **Opposition:** Institutionalized and active; negative judgments possess high cognitive stickiness
- **Evaluation Mode:** Passive or ritualized rejection
- **Prescribed Strategies:** Impression management, Decoupling, Normalization accounts, Relocating to favorable jurisdictions

## DYNAMIC SHIFTS (Figure 2 in Paper)
- **Trigger:** Venture enters a new environment or market
- **Determinants:** Stability of Reference Framework × Presence of Type Conflicts × Strength of Societal NVBs
- **Key Insight:** A venture's legitimacy state can flip from legitimate to contested without any change in its own behavior, solely because the societal yardstick shifted`,
