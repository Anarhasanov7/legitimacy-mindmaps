<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper–Journal Network — Legitimacy Map</title>
<style>
  :root{--ink:#1f2328;--muted:#656d76;--line:#d0d7de;--bg:#ffffff;--soft:#f6f8fa;--accent:#0969da}
  *{box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
  header{padding:20px 24px 14px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  .nav{margin-left:auto;font-size:13px}
  .nav a{color:var(--accent);text-decoration:none;margin-left:14px}
  .legend{display:flex;gap:14px;padding:10px 24px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  #graph{display:block;width:100vw;height:calc(100vh - 108px);cursor:grab}
  #graph:active{cursor:grabbing}
  section{border-top:1px solid var(--line)}
  section h2{font-size:15px;margin:0;padding:14px 24px 2px}
  section .sub{display:block;padding:0 24px 8px}
  #disk{display:block;width:100vw;height:85vh;cursor:grab}
  #disk:active{cursor:grabbing}
  .edge{stroke:var(--line);stroke-width:1}
  .journal{fill:var(--accent);stroke:#fff;stroke-width:2}
  .jlabel{font-size:11px;font-weight:600;fill:var(--ink);pointer-events:none}
  .jcount{font-size:9px;fill:#fff;font-weight:700;pointer-events:none;text-anchor:middle}
  .plabel{font-size:9.5px;fill:var(--muted);pointer-events:none;font-weight:600}
  #tip{position:fixed;display:none;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);pointer-events:none;z-index:10}
  #tip b{display:block;margin-bottom:4px}
  #tip .meta{color:var(--muted);font-size:12px;margin-top:6px}
  #tip .solves{color:var(--accent);font-size:12px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Paper → Journal network</h1>
  <span class="sub">49 papers · where each published · drag nodes, hover for details</span>
  <span class="nav"><a href="index.html">Guide</a><a href="map.html">Mind map</a></span>
</header>
<div class="legend" id="legend"></div>
<svg id="graph"></svg>
<section>
  <h2>Journal disk — same papers, radial view</h2>
  <span class="sub">Journals on the inner ring (size = # of your papers) · papers orbit their journal · sector width ∝ paper count · hover for details</span>
  <svg id="disk"></svg>
</section>
<div id="tip"></div>
<script src="d3.min.js"></script>
<script src="papers.js"></script>
<script>
const LCOL = {L1:'#0969da', L2:'#1a7f37', L3:'#bf8700', L4:'#8250df', S:'#cf222e'};
const LNAME = {L1:'L1 Judge', L2:'L2 Connection', L3:'L3 Object', L4:'L4 Field', S:'S Scale anchor'};

const journals = {};
DATA.papers.forEach(p => { (journals[p.venue] = journals[p.venue] || []).push(p); });

const nodes = [], links = [];
Object.entries(journals).forEach(([abbr, ps]) => {
  nodes.push({id:abbr, type:'journal', name:DATA.journals[abbr], n:ps.length});
});
DATA.papers.forEach(p => {
  nodes.push({id:p.id, type:'paper', p});
  links.push({source:p.id, target:p.venue});
});

const svg = d3.select('#graph'), tip = document.getElementById('tip');
const W = svg.node().clientWidth, H = svg.node().clientHeight;
const g = svg.append('g');
svg.call(d3.zoom().on('zoom', e => g.attr('transform', e.transform)));

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(70))
  .force('charge', d3.forceManyBody().strength(d => d.type === 'journal' ? -260 : -50))
  .force('center', d3.forceCenter(W/2, H/2))
  .force('collide', d3.forceCollide(d => d.type === 'journal' ? 30 + d.n*4 : 14));

const link = g.append('g').selectAll('line').data(links).join('line').attr('class','edge');

const node = g.append('g').selectAll('g').data(nodes).join('g')
  .call(d3.drag()
    .on('start', (e,d) => { if(!e.active) sim.alphaTarget(.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on('drag', (e,d) => { d.fx=e.x; d.fy=e.y; })
    .on('end', (e,d) => { if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

node.filter(d => d.type==='journal').append('circle')
  .attr('class','journal').attr('r', d => 14 + d.n*3.5);
node.filter(d => d.type==='journal').append('text')
  .attr('class','jcount').attr('dy',3).text(d => d.n);
node.filter(d => d.type==='journal').append('text')
  .attr('class','jlabel').attr('y', d => -18 - d.n*3.5).attr('text-anchor','middle')
  .text(d => d.name.length > 34 ? d.name.slice(0,33)+'…' : d.name);

node.filter(d => d.type==='paper').append('circle')
  .attr('r', 8).attr('fill', d => LCOL[d.p.level]).attr('stroke','#fff').attr('stroke-width',1.5);
node.filter(d => d.type==='paper').append('text')
  .attr('class','plabel').attr('x', 11).attr('y', 3).text(d => d.id);

node.on('mouseover', (e,d) => {
    if(d.type==='journal'){
      tip.innerHTML = `<b>${d.name}</b><span class="meta">${d.n} paper${d.n>1?'s':''} in your map</span>`;
    } else {
      const p=d.p;
      tip.innerHTML = `<b>[${p.id}] ${p.formula}</b>${p.authors} ${p.year}, ${p.venue} · ${p.cit} cit.<div class="solves">solves: ${p.solves}</div><div class="meta">${LNAME[p.level]}</div>`;
    }
    tip.style.display='block';
  })
  .on('mousemove', e => {
    tip.style.left = Math.min(e.clientX+14, innerWidth-360)+'px';
    tip.style.top = (e.clientY+14)+'px';
  })
  .on('mouseout', () => tip.style.display='none');

sim.on('tick', () => {
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
      .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform', d => `translate(${d.x},${d.y})`);
});

let fitted = false;
sim.on('end', () => {
  if (fitted) return; fitted = true;
  const xs = nodes.map(d=>d.x), ys = nodes.map(d=>d.y);
  const x1=Math.min(...xs)-60, x2=Math.max(...xs)+60, y1=Math.min(...ys)-60, y2=Math.max(...ys)+60;
  const k = Math.min(W/(x2-x1), H/(y2-y1), 1);
  svg.transition().duration(500).call(d3.zoom().transform,
    d3.zoomIdentity.translate(W/2-(x1+x2)/2*k, H/2-(y1+y2)/2*k).scale(k));
});

document.getElementById('legend').innerHTML =
  Object.entries(LNAME).map(([k,v]) => `<span><span class="dot" style="background:${LCOL[k]}"></span>${v}</span>`).join('') +
  `<span style="margin-left:auto"><span class="dot" style="background:var(--accent)"></span>journal (size = # of your papers)</span>`;

/* ---------- DISK VIEW: journals on a ring, papers orbiting in sectors ---------- */
const dsvg = d3.select('#disk');
const DW = dsvg.node().clientWidth, DH = dsvg.node().clientHeight;
const cx = DW/2, cy = DH/2;
const Rj = Math.min(DW, DH)/2 - 120;           // journal ring radius
const Rp = Rj + 62;                            // paper orbit radius
const dg = dsvg.append('g');
dsvg.call(d3.zoom().on('zoom', e => dg.attr('transform', e.transform)));

// sectors: width proportional to journal's paper count
const jList = Object.entries(journals).map(([abbr, ps]) => ({abbr, ps}))
  .sort((a,b) => b.ps.length - a.ps.length);
const totalP = DATA.papers.length, GAP = 0.012;
let a0 = -Math.PI/2;
jList.forEach(j => {
  const w = (j.ps.length/totalP) * (2*Math.PI - GAP*jList.length);
  j.a0 = a0; j.a1 = a0 + w; j.mid = (a0 + a0 + w)/2; a0 = j.a1 + GAP;
});

// edges first (under nodes)
jList.forEach(j => {
  const jx = cx + Rj*Math.cos(j.mid), jy = cy + Rj*Math.sin(j.mid);
  j.ps.forEach((p,i) => {
    const a = j.a0 + (i + .5)/j.ps.length * (j.a1 - j.a0);
    p._x = cx + Rp*Math.cos(a); p._y = cy + Rp*Math.sin(a); p._a = a;
    dg.append('line').attr('class','edge')
      .attr('x1', p._x).attr('y1', p._y).attr('x2', jx).attr('y2', jy);
  });
});

// journals
const dj = dg.append('g').selectAll('g').data(jList).join('g')
  .attr('transform', d => `translate(${cx + Rj*Math.cos(d.mid)},${cy + Rj*Math.sin(d.mid)})`);
dj.append('circle').attr('class','journal').attr('r', d => 14 + d.ps.length*3.5);
dj.append('text').attr('class','jcount').attr('dy',3).text(d => d.ps.length);
dj.append('text').attr('class','jlabel')
  .attr('text-anchor','middle')
  .attr('transform', d => {
    const deg = d.mid*180/Math.PI + 90;
    const flip = deg > 90 && deg < 270 ? 180 : 0;
    return `rotate(${deg + flip}) translate(0,${flip ? 20 + d.ps.length*3.5 : -(20 + d.ps.length*3.5)})`;
  })
  .text(d => {
    const n = DATA.journals[d.abbr];
    if (d.ps.length < 3) return d.abbr;
    return n.length > 30 ? n.slice(0,29)+'…' : n;
  });

// papers
const dp = dg.append('g').selectAll('g').data(DATA.papers).join('g')
  .attr('transform', d => `translate(${d._x},${d._y})`);
dp.append('circle').attr('r', 7).attr('fill', d => LCOL[d.level])
  .attr('stroke','#fff').attr('stroke-width',1.5);
dp.append('text').attr('class','plabel')
  .attr('transform', d => {
    const deg = d._a*180/Math.PI + 90;
    const flip = deg > 90 && deg < 270;
    return `rotate(${deg + (flip?180:0)}) translate(${flip?-11:11},3)`;
  })
  .attr('text-anchor', d => { const deg = d._a*180/Math.PI + 90; return (deg > 90 && deg < 270) ? 'end' : 'start'; })
  .text(d => d.id);

// same tooltips
function showTip(e, d){
  if (d.ps) tip.innerHTML = `<b>${DATA.journals[d.abbr]}</b><span class="meta">${d.ps.length} paper${d.ps.length>1?'s':''} in your map</span>`;
  else tip.innerHTML = `<b>[${d.id}] ${d.formula}</b>${d.authors} ${d.year}, ${d.venue} · ${d.cit} cit.<div class="solves">solves: ${d.solves}</div><div class="meta">${LNAME[d.level]}</div>`;
  tip.style.display='block';
}
const hover = sel => sel.on('mouseover', showTip)
  .on('mousemove', e => { tip.style.left = Math.min(e.clientX+14, innerWidth-360)+'px'; tip.style.top = (e.clientY+14)+'px'; })
  .on('mouseout', () => tip.style.display='none');
hover(dj); hover(dp);
</script>
</body>
</html>
